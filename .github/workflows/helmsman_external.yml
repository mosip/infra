name: Deploy External services of mosip using Helmsman

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Deployment profile to use"
        required: true
        default: "mosip-platform-1.2.0.x"
        type: choice
        options:
          - mosip-platform-1.2.0.x
          - mosip-platform-1.2.1.x
          - esignet-standalone
      mode:
        description: "Choose Helmsman mode: dry-run or apply"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
      domain_name:
        description: "Domain name for this environment (e.g. example.xyz.net)"
        required: true
        type: string
      db_port:
        description: "PostgreSQL port for MOSIP platform external postgres (e.g. 5433)"
        required: true
        type: string
      esignet_db_port:
        description: "Optional: PostgreSQL port for the eSignet standalone postgres (empty = vars.ESIGNET_DB_PORT, else 5432)"
        required: false
        type: string
      keycloak_db:
        description: "Keycloak database: bundled or external (shared PostgreSQL). Empty = keep vars.KEYCLOAK_DB; unset = bundled"
        required: false
        type: string
      env_name:
        description: "Environment name (e.g. sandbox, dev, staging)"
        required: false
        type: string
      alert_recipients:
        description: "Organization mail id(s) for cluster alert notifications, comma-separated (e.g. xyz@gmail.com, abc@gmail.com). Needed for mosip-platform-1.2.1.x; empty = vars.ALERT_RECIPIENTS"
        required: false
        type: string
      smtp_from:
        description: "Alertmanager sender address (mosip-platform-1.2.1.x), e.g. alerts@example.org; empty = vars.SMTP_FROM (legacy vars.MAIL_ID). Password: secrets.SMTP_PASSWORD"
        required: false
        type: string
      smtp_host:
        description: "Alertmanager SMTP server host:port (mosip-platform-1.2.1.x); empty = vars.SMTP_HOST, else smtp.gmail.com:587"
        required: false
        type: string
      smtp_username:
        description: "Alertmanager SMTP login (mosip-platform-1.2.1.x); empty = vars.SMTP_USERNAME, else the sender address"
        required: false
        type: string
      slack_channel_name:
        description: "Optional, rancher-monitoring profiles only (1.2.0.x, esignet-standalone): Slack channel for alerting (e.g. #mosip-alerts); empty = vars.SLACK_CHANNEL_NAME"
        required: false
        type: string
      slack_webhook_url:
        description: "Optional, rancher-monitoring profiles only: Slack webhook URL (prefer secrets.SLACK_WEBHOOK_URL); masked in logs"
        required: false
        type: string
      clusterid:
        description: "Rancher cluster ID (e.g. c-xxxxx): required for 1.2.0.x / esignet-standalone (rancher-monitoring), unused by 1.2.1.x; empty = vars.CLUSTER_ID"
        required: false
        type: string
  push:
    paths:
      - Helmsman/dsf/**/prereq-dsf.yaml
      - Helmsman/dsf/**/external-dsf.yaml

permissions:
  actions: write
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    steps:
      - name: Validate required variables
        env:
          PROFILE_INPUT: ${{ github.event.inputs.profile }}
          SMTP_FROM: ${{ github.event.inputs.smtp_from || vars.SMTP_FROM || vars.MAIL_ID }}
          IN_SMTP_FROM: ${{ github.event.inputs.smtp_from }}
          IN_SMTP_HOST: ${{ github.event.inputs.smtp_host }}
          IN_SMTP_USERNAME: ${{ github.event.inputs.smtp_username }}
          CLUSTER: ${{ github.event.inputs.clusterid || vars.CLUSTER_ID }}
          SLACK_CH: ${{ github.event.inputs.slack_channel_name || vars.SLACK_CHANNEL_NAME }}
          ESIGNET_DB_PORT: ${{ github.event.inputs.esignet_db_port || vars.ESIGNET_DB_PORT || '5432' }}
        run: |
          errors=()
          DOMAIN="${{ github.event.inputs.domain_name || vars.DOMAIN_NAME }}"
          ENV="${{ github.event.inputs.env_name || vars.ENV_NAME }}"
          ALERT_RECIPIENTS="${{ github.event.inputs.alert_recipients || vars.ALERT_RECIPIENTS || vars.MAIL_ID }}"
          SMTP_PASSWORD_SET="${{ secrets.SMTP_PASSWORD != '' }}"
          DB_PORT="${{ github.event.inputs.db_port || vars.DB_PORT }}"
          [ -z "$DOMAIN" ]          && errors+=("domain_name is empty — set vars.DOMAIN_NAME under Environment '${{ github.ref_name }}'")
          [ -z "$ENV" ]             && errors+=("env_name is empty — set vars.ENV_NAME under Environment '${{ github.ref_name }}'")
          # Rancher cluster ID: only rancher-monitoring profiles use it. Push runs
          # (no profile input) are checked per DSF in the deploy job.
          case "$PROFILE_INPUT" in
            mosip-platform-1.2.0.x|esignet-standalone)
              [ -z "$CLUSTER" ] && errors+=("clusterid is empty — required for $PROFILE_INPUT (rancher-monitoring); set vars.CLUSTER_ID under Environment '${{ github.ref_name }}'") ;;
          esac
          [ -z "$DB_PORT" ]         && errors+=("db_port is empty — set vars.DB_PORT under Environment '${{ github.ref_name }}'")
          # Typed SMTP values are saved as environment variables: check their format.
          if [ -n "$IN_SMTP_HOST" ] && ! [[ "$IN_SMTP_HOST" =~ ^[A-Za-z0-9.-]+:[0-9]{1,5}$ ]]; then
            errors+=("smtp_host must be host:port (e.g. smtp.gmail.com:587)")
          fi
          for v in "$IN_SMTP_FROM" "$IN_SMTP_USERNAME"; do
            if [ -n "$v" ] && ! [[ "$v" =~ ^[A-Za-z0-9._%+@-]+$ ]]; then
              errors+=("smtp_from / smtp_username may only contain letters, digits and . _ % + @ -")
            fi
          done
          if [ ${#errors[@]} -gt 0 ]; then
            echo "❌ Required variables missing:"
            printf '  - %s\n' "${errors[@]}"
            echo "Go to: Settings → Environments → ${{ github.ref_name }} → Variables"
            exit 1
          fi
          # Alerting settings are profile-specific, so they only warn here:
          #  - mosip-platform-1.2.1.x (kube-prometheus-stack, email): ALERT_RECIPIENTS, SMTP_FROM, SMTP_PASSWORD
          #  - mosip-platform-1.2.0.x / esignet-standalone (rancher-monitoring, Slack): SLACK_CHANNEL_NAME, SLACK_WEBHOOK_URL
          # The 1.2.1.x monitoring hook fails with a clear message if its settings are missing.
          [ -z "$ALERT_RECIPIENTS" ]          && echo "⚠ alert_recipients is empty — set vars.ALERT_RECIPIENTS (required for mosip-platform-1.2.1.x email alerting)"
          [ -z "$SMTP_FROM" ]                 && echo "⚠ SMTP sender is empty — pass smtp_from or set vars.SMTP_FROM (required for mosip-platform-1.2.1.x email alerting)"
          [ "$SMTP_PASSWORD_SET" != "true" ]  && echo "⚠ secrets.SMTP_PASSWORD is not set (required for mosip-platform-1.2.1.x email alerting)"
          [ -z "$SLACK_CH" ]                  && echo "⚠ slack_channel_name is empty — set vars.SLACK_CHANNEL_NAME (only used by rancher-monitoring profiles: 1.2.0.x, esignet-standalone)"
          echo "✓ domain_name        = $DOMAIN"
          echo "✓ env_name           = $ENV"
          echo "✓ alert_recipients   = $ALERT_RECIPIENTS"
          echo "✓ smtp_from          = $SMTP_FROM"
          echo "✓ clusterid          = $CLUSTER"
          echo "✓ slack_channel_name = $SLACK_CH"
          echo "✓ db_port            = $DB_PORT"
          echo "✓ esignet_db_port    = $ESIGNET_DB_PORT"

      - name: Validate KEYCLOAK_DB
        env:
          KEYCLOAK_DB: ${{ github.event.inputs.keycloak_db || vars.KEYCLOAK_DB }}
        run: |
          case "${KEYCLOAK_DB:-bundled}" in
            bundled|external) echo "✓ keycloak_db        = ${KEYCLOAK_DB:-bundled}" ;;
            *) echo "❌ keycloak_db / vars.KEYCLOAK_DB must be 'bundled' (default) or 'external'"; exit 1 ;;
          esac

      - name: Persist workflow inputs as environment variables
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GH_INFRA_PAT }}
          KEYCLOAK_DB_INPUT: ${{ github.event.inputs.keycloak_db }}
          IN_CLUSTER_ID: ${{ github.event.inputs.clusterid }}
          IN_SLACK_CHANNEL_NAME: ${{ github.event.inputs.slack_channel_name }}
          IN_ESIGNET_DB_PORT: ${{ github.event.inputs.esignet_db_port }}
          IN_SMTP_FROM: ${{ github.event.inputs.smtp_from }}
          IN_SMTP_HOST: ${{ github.event.inputs.smtp_host }}
          IN_SMTP_USERNAME: ${{ github.event.inputs.smtp_username }}
        run: |
          REPO="${{ github.repository }}"
          ENVIRONMENT="${{ github.ref_name }}"
          save_var() {
            local name=$1 value=$2
            if [ -z "$value" ]; then echo "⏭  Skipping $name — no input provided, existing value preserved"; return; fi
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/environments/$ENVIRONMENT/variables/$name" \
              -d "{\"name\":\"$name\",\"value\":\"$value\"}")
            if [ "$STATUS" = "404" ]; then
              curl -f -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/environments/$ENVIRONMENT/variables" \
                -d "{\"name\":\"$name\",\"value\":\"$value\"}" && echo "✓ Created $name"
            elif [ "$STATUS" = "200" ] || [ "$STATUS" = "204" ]; then
              echo "✓ Updated $name"
            else
              echo "✗ Failed to save $name (HTTP $STATUS)"; exit 1
            fi
          }
          save_var "DOMAIN_NAME"        "${{ github.event.inputs.domain_name }}"
          save_var "DB_PORT"            "${{ github.event.inputs.db_port }}"
          save_var "ESIGNET_DB_PORT"    "$IN_ESIGNET_DB_PORT"
          save_var "KEYCLOAK_DB"        "$KEYCLOAK_DB_INPUT"   # validated above: bundled | external
          save_var "ENV_NAME"           "${{ github.event.inputs.env_name }}"
          save_var "ALERT_RECIPIENTS"   "${{ github.event.inputs.alert_recipients }}"
          save_var "SMTP_FROM"          "$IN_SMTP_FROM"       # format validated above
          save_var "SMTP_HOST"          "$IN_SMTP_HOST"
          save_var "SMTP_USERNAME"      "$IN_SMTP_USERNAME"
          save_var "CLUSTER_ID"         "$IN_CLUSTER_ID"
          save_var "SLACK_CHANNEL_NAME" "$IN_SLACK_CHANNEL_NAME"

  set-matrix:
    runs-on: ubuntu-latest
    needs: validate-inputs
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      profile: ${{ steps.set-matrix.outputs.PROFILE }}
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full commit history

      - name: Generate workflow matrix
        id: set-matrix
        run: |
          matrix_json='{"include":[]}'
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            PROFILE="${{ github.event.inputs.profile }}"
            matrix_json="{\"include\":[{\"dsf_files\":\"${PROFILE}/prereq-dsf.yaml\",\"wg_conf\":\"wg0\"},{\"dsf_files\":\"${PROFILE}/external-dsf.yaml\",\"wg_conf\":\"wg1\"}]}"
          else
            # Handle different event types properly
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              base_sha="${{ github.event.before }}"
              head_sha="${{ github.sha }}"
            elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              base_sha="${{ github.event.pull_request.base.sha }}"
              head_sha="${{ github.event.pull_request.head.sha }}"
            fi

            # Get changed files safely; fall back to HEAD~1 if base_sha is unreachable
            changed_files=$(git diff --name-only "$base_sha" "$head_sha" -- 'Helmsman/dsf/' 2>/dev/null || \
                            git diff --name-only HEAD~1 HEAD -- 'Helmsman/dsf/' 2>/dev/null || echo "")

            entries=()

            # Dynamically detect changed profiles from file paths
            changed_profiles=$(echo "$changed_files" | grep 'Helmsman/dsf/' | sed 's|Helmsman/dsf/\([^/]*\)/.*|\1|' | sort -u)

            # Derive PROFILE from the changed files; take the first detected profile for downstream dispatch
            PROFILE=$(echo "$changed_profiles" | head -n 1)
            if [[ -z "$PROFILE" ]]; then
              echo "Error: could not detect profile from changed DSF files."
              exit 1
            fi

            for profile_dir in $changed_profiles; do
              if echo "$changed_files" | grep -q "Helmsman/dsf/${profile_dir}/prereq-dsf.yaml"; then
                entries+=("{\"dsf_files\":\"${profile_dir}/prereq-dsf.yaml\",\"wg_conf\":\"wg0\"}")
              fi

              if echo "$changed_files" | grep -q "Helmsman/dsf/${profile_dir}/external-dsf.yaml"; then
                entries+=("{\"dsf_files\":\"${profile_dir}/external-dsf.yaml\",\"wg_conf\":\"wg1\"}")
              fi
            done

            if [ ${#entries[@]} -gt 0 ]; then
              matrix_json="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"
            fi
          fi

          echo "Using profile: $PROFILE"
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
          echo "PROFILE=$PROFILE" >> $GITHUB_OUTPUT
  deploy:
    runs-on: ubuntu-latest
    needs: set-matrix
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    environment: 
      name: ${{ github.ref_name }}  # Dynamic environment based on branch name
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      PATH: ${{ github.workspace }}/istio-1.22.0/bin:${{ github.workspace }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ISTIOCTL_PATH: ${{ github.workspace }}/istio-1.22.0/bin/istioctl
      KUBECTL_PATH: ${{ github.workspace }}/.local/bin/kubectl
      domain_name:         ${{ github.event.inputs.domain_name         || vars.DOMAIN_NAME }}
      db_port:             ${{ github.event.inputs.db_port             || vars.DB_PORT }}
      esignet_db_port:     ${{ github.event.inputs.esignet_db_port     || vars.ESIGNET_DB_PORT || '5432' }}
      env_name:            ${{ github.event.inputs.env_name            || vars.ENV_NAME }}
      # Keycloak database: keycloak_db input or vars.KEYCLOAK_DB = bundled (default) | external.
      # Used by the keycloak / keycloak-db-init apps of the external DSFs.
      KEYCLOAK_EXTERNAL_DB: ${{ (github.event.inputs.keycloak_db || vars.KEYCLOAK_DB) == 'external' }}
      KEYCLOAK_BUNDLED_DB:  ${{ (github.event.inputs.keycloak_db || vars.KEYCLOAK_DB) != 'external' }}
      # Email alerting (kube-prometheus-stack, mosip-platform-1.2.1.x).
      # MAIL_ID is the legacy single-address variable, kept as a fallback.
      smtp_host:           ${{ github.event.inputs.smtp_host || vars.SMTP_HOST || 'smtp.gmail.com:587' }}
      smtp_from:           ${{ github.event.inputs.smtp_from || vars.SMTP_FROM || vars.MAIL_ID }}
      smtp_username:       ${{ github.event.inputs.smtp_username || vars.SMTP_USERNAME || github.event.inputs.smtp_from || vars.SMTP_FROM || vars.MAIL_ID }}
      alert_recipients:    ${{ github.event.inputs.alert_recipients    || vars.ALERT_RECIPIENTS || vars.MAIL_ID }}
      slack_channel_name:  ${{ github.event.inputs.slack_channel_name  || vars.SLACK_CHANNEL_NAME }}
      SLACK_WEBHOOK_URL:   ${{ github.event.inputs.slack_webhook_url   || secrets.SLACK_WEBHOOK_URL }}
      CLUSTER_ID:          ${{ github.event.inputs.clusterid           || vars.CLUSTER_ID }}
      SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      ESIGNET_CAPTCHA_SITE_KEY: ${{ secrets.ESIGNET_CAPTCHA_SITE_KEY }}
      ESIGNET_CAPTCHA_SECRET_KEY: ${{ secrets.ESIGNET_CAPTCHA_SECRET_KEY }}
      PREREG_CAPTCHA_SITE_KEY: ${{ secrets.PREREG_CAPTCHA_SITE_KEY }}
      PREREG_CAPTCHA_SECRET_KEY: ${{ secrets.PREREG_CAPTCHA_SECRET_KEY }}
      ADMIN_CAPTCHA_SITE_KEY: ${{ secrets.ADMIN_CAPTCHA_SITE_KEY }}
      ADMIN_CAPTCHA_SECRET_KEY: ${{ secrets.ADMIN_CAPTCHA_SECRET_KEY }}
      RESIDENT_CAPTCHA_SITE_KEY: ${{ secrets.RESIDENT_CAPTCHA_SITE_KEY }}
      RESIDENT_CAPTCHA_SECRET_KEY: ${{ secrets.RESIDENT_CAPTCHA_SECRET_KEY }}
    steps:
      - name: Show matrix values
        run: |
          echo "Processing ${{ matrix.dsf_files }}"
          echo "Using WireGuard config: ${{ matrix.wg_conf }}"
          pwd

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Mask sensitive secrets
        run: |
          echo "::add-mask::${{ secrets.SMTP_PASSWORD }}"
          echo "::add-mask::${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
          echo "::add-mask::${{ secrets.ESIGNET_CAPTCHA_SITE_KEY }}"
          echo "::add-mask::${{ secrets.ESIGNET_CAPTCHA_SECRET_KEY }}"
          echo "::add-mask::${{ secrets.PREREG_CAPTCHA_SITE_KEY }}"
          echo "::add-mask::${{ secrets.PREREG_CAPTCHA_SECRET_KEY }}"
          echo "::add-mask::${{ secrets.ADMIN_CAPTCHA_SITE_KEY }}"
          echo "::add-mask::${{ secrets.ADMIN_CAPTCHA_SECRET_KEY }}"
          echo "::add-mask::${{ secrets.RESIDENT_CAPTCHA_SITE_KEY }}"
          echo "::add-mask::${{ secrets.RESIDENT_CAPTCHA_SECRET_KEY }}"

      - name: Setup kubectl, istioctl and kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          # Create directories
          mkdir -p ${{ github.workspace }}/.local/bin
          mkdir -p ${{ github.workspace }}/.kube
          
          # Install kubectl
          curl -LO https://dl.k8s.io/release/v1.31.3/bin/linux/amd64/kubectl
          chmod +x kubectl
          mv ./kubectl ${{ github.workspace }}/.local/bin/kubectl
          
          # Install istioctl
          curl -L https://istio.io/downloadIstio | ISTIO_VERSION=1.22.0 TARGET_ARCH=x86_64 sh -
          
          # Setup kubeconfig
          echo "$KUBECONFIG_CONTENT" > ${{ github.workspace }}/.kube/config
          chmod 400 ${{ github.workspace }}/.kube/config
          
          # Add tools to GitHub PATH for subsequent steps
          echo "${{ github.workspace }}/.local/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/istio-1.22.0/bin" >> $GITHUB_PATH
          
          # Export environment variables for immediate use
          echo "KUBECTL_PATH=${{ github.workspace }}/.local/bin/kubectl" >> $GITHUB_ENV
          echo "ISTIOCTL_PATH=${{ github.workspace }}/istio-1.22.0/bin/istioctl" >> $GITHUB_ENV
          
          # Verify installations
          ${{ github.workspace }}/.local/bin/kubectl version --client
          ${{ github.workspace }}/istio-1.22.0/bin/istioctl version --remote=false
          ${{ github.workspace }}/.local/bin/kubectl config view

      - name: Set Default Mode
        run: |
          if [ -z "${{ github.event.inputs.mode }}" ]; then
            echo "HELMSMAN_MODE=apply" >> $GITHUB_ENV
          else
            echo "HELMSMAN_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          fi        

      - name: Setup ufw firewall
        run: |
          sudo ufw enable
          sudo ufw allow ssh
          sudo ufw allow 51820/udp
          sudo ufw status  

      - name: Install WireGuard
        run: sudo apt-get install -y wireguard

      - name: Configure WireGuard
        run: |
          echo "${{ secrets.CLUSTER_WIREGUARD_WG0 }}" | sudo tee /etc/wireguard/wg0.conf
          echo "${{ secrets.CLUSTER_WIREGUARD_WG1 }}" | sudo tee /etc/wireguard/wg1.conf

      - name: Start WireGuard
        run: |
          sudo chmod 600 /etc/wireguard/${{ matrix.wg_conf }}.conf
          sudo chmod 700 /etc/wireguard/
          sudo chmod 644 /lib/systemd/system/wg-quick@.service
          sudo systemctl daemon-reload
          sudo wg-quick up ${{ matrix.wg_conf }}
          sudo wg show ${{ matrix.wg_conf }}

      - name: Setup Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3
          sudo chmod 700 get_helm.sh
          sudo ./get_helm.sh
          helm version --client

      - name: Install Helmsman
        run: |
          curl -L https://github.com/Praqma/helmsman/releases/download/v3.17.1/helmsman_3.17.1_linux_amd64.tar.gz -o helmsman.tar.gz
          tar xzf helmsman.tar.gz
          sudo mv helmsman /usr/local/bin
          
          # Verify all tools are available
          echo "All tools verification:"
          echo "kubectl: $(which kubectl)"
          echo "istioctl: $(which istioctl)" 
          echo "helmsman: $(which helmsman)"
          
          kubectl version --client
          istioctl version --remote=false
          helmsman -v
      
      - name: Verify cluster access
        run: |
          # Verify tools are accessible
          echo "Verifying tool availability:"
          echo "kubectl path: $(which kubectl)"
          echo "istioctl path: $(which istioctl)"
          echo "KUBECONFIG: $KUBECONFIG"
          
          # Test kubectl functionality
          kubectl version --client
          kubectl get nodes
          kubectl cluster-info
          
          # Test istioctl functionality
          istioctl version --remote=false

      - name: Fetch and mask minio root password
        run: |
          # Must run after WireGuard/kubeconfig are up - kubectl needs cluster
          # access to look up the existing secret. Fetching this earlier (as
          # part of "Mask sensitive secrets", before the tunnel is up) always
          # returned empty, which then failed minio's helm upgrade with
          # "auth.rootPassword must not be empty".
          MINIO_ROOT_PASSWORD=$(kubectl -n minio get secret minio -o jsonpath='{.data.root-password}' 2>/dev/null | base64 -d || true)
          if [ -n "$MINIO_ROOT_PASSWORD" ]; then echo "::add-mask::$MINIO_ROOT_PASSWORD"; fi
          echo "MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD" >> $GITHUB_ENV

      - name: Export keycloak client secrets for esignet-keycloak-init
        if: contains(matrix.dsf_files, 'esignet-standalone/external-dsf.yaml')
        run: |
          # Read existing client secrets from keycloak ns — empty on fresh install,
          # real values on re-run. Helmsman resolves ${VAR} at parse time so these
          # must be in $GITHUB_ENV before helmsman starts.
          get_secret() {
            kubectl -n keycloak get secret keycloak-client-secrets \
              -o jsonpath="{.data.$1}" 2>/dev/null | base64 -d || echo ""
          }
          PMS=$(get_secret mosip_pms_client_secret)
          MPARTNER=$(get_secret mpartner_default_auth_secret)
          IDA=$(get_secret mosip_ida_client_secret)
          DEPLOY=$(get_secret mosip_deployment_client_secret)
          MOBILE=$(get_secret mpartner_default_mobile_secret)
          [ -n "$PMS" ]     && echo "::add-mask::$PMS"
          [ -n "$MPARTNER" ] && echo "::add-mask::$MPARTNER"
          [ -n "$IDA" ]     && echo "::add-mask::$IDA"
          [ -n "$DEPLOY" ]  && echo "::add-mask::$DEPLOY"
          [ -n "$MOBILE" ]  && echo "::add-mask::$MOBILE"
          echo "PMS_CLIENT_SECRET_VALUE=$PMS"                       >> $GITHUB_ENV
          echo "MPARTNER_DEFAULT_AUTH_SECRET_VALUE=$MPARTNER"       >> $GITHUB_ENV
          echo "IDA_CLIENT_SECRET_VALUE=$IDA"                       >> $GITHUB_ENV
          echo "DEPLOYMENT_CLIENT_SECRET_VALUE=$DEPLOY"             >> $GITHUB_ENV
          echo "MPARTNER_DEFAULT_MOBILE_SECRET_VALUE=$MOBILE"       >> $GITHUB_ENV

      - name: Check if external-dsf label is completed only for push
        if: github.event_name == 'push'
        run: |
          STATUS=$(kubectl get namespace default -o jsonpath='{.metadata.labels.external-dsf}')
          if [[ "$STATUS" != "completed" ]]; then
            echo "❌ External DSF not completed."
            exit 1
          fi
          
      - name: Check rancher-monitoring settings for this DSF
        env:
          DSF: Helmsman/dsf/${{ matrix.dsf_files }}
        run: |
          # A typed slack_webhook_url input is not a secret: mask it in the logs.
          if [ -n "$SLACK_WEBHOOK_URL" ]; then echo "::add-mask::$SLACK_WEBHOOK_URL"; fi
          # rancher-monitoring DSFs (1.2.0.x, esignet-standalone prereq) need the
          # Rancher cluster ID; 1.2.1.x has it commented out.
          if grep -qE '^[^#]*[$][{]?CLUSTER_ID' "$DSF" && [ -z "$CLUSTER_ID" ]; then
            echo "❌ $DSF uses CLUSTER_ID (rancher-monitoring): pass clusterid or set vars.CLUSTER_ID"
            exit 1
          fi

      - name: Show deployment variables
        run: |
          echo "domain_name        = $domain_name"
          echo "env_name           = $env_name"
          echo "keycloak bundled db = $KEYCLOAK_BUNDLED_DB (external = $KEYCLOAK_EXTERNAL_DB)"
          echo "smtp_host          = $smtp_host"
          echo "smtp_from          = $smtp_from"
          echo "alert_recipients   = $alert_recipients"
          echo "slack_channel_name = $slack_channel_name"
          echo "CLUSTER_ID         = $CLUSTER_ID"

      - name: Initiate helmsman to apply the DSF configurations.
        run: |
          export HOME="${{ github.workspace }}"
          export WORKDIR="$HOME/Helmsman"
          
          # Verify tools are available
          echo "Using kubectl: $(which kubectl)"
          echo "Using istioctl: $(which istioctl)"
          echo "Using kubeconfig: $KUBECONFIG"
          
          # Run helmsman with the determined mode
          helmsman --subst-env-values --${HELMSMAN_MODE} -f $WORKDIR/dsf/${{ matrix.dsf_files }}
      - name: Health Check External Pods
        run: |
          set -e
          NAMESPACES=( cattle-logging-system istio-system istio-operator httpbin keycloak kafka minio softhsm clamav activemq landing-page)
          for NS in "${NAMESPACES[@]}"; do
            echo "Checking health for namespace: $NS"
            for i in {1..30}; do
              UNREADY=$(kubectl get pods -n "$NS" --no-headers | grep -vE 'Running|Completed' | wc -l)
              if [ "$UNREADY" -eq 0 ]; then
                break
              fi
              sleep 10
            done
            UNREADY_FINAL=$(kubectl get pods -n "$NS" --no-headers | grep -vE 'Running|Completed' | wc -l)
            if [ "$UNREADY_FINAL" -ne 0 ]; then
              echo "Pods in $NS not healthy"
              exit 1
            fi
          done

      - name: Mark External DSF Completed
        run: |
          kubectl label namespace default external-dsf=completed --overwrite

  workflow-caller:
    runs-on: ubuntu-latest
    needs: [deploy, set-matrix]
    # Only trigger MOSIP workflow for mosip-platform profiles, not for standalone esignet
    if: ${{ startsWith(needs.set-matrix.outputs.profile, 'mosip-platform-') }}
    steps:
      - name: Trigger helmsman mosip workflow via API
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GH_INFRA_PAT }}
          BRANCH: ${{ github.ref_name }}
          MODE: ${{ github.event.inputs.mode }}
          DOMAIN_NAME: ${{ github.event.inputs.domain_name || vars.DOMAIN_NAME }}
          ENV_NAME: ${{ github.event.inputs.env_name || vars.ENV_NAME }}
        run: |
          # --fail-with-body: a rejected dispatch (e.g. 422 unexpected inputs)
          # must fail this step instead of silently looking green.
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$GITHUB_REPO/actions/workflows/helmsman_mosip.yml/dispatches \
            -d '{"ref":"'"$BRANCH"'","inputs":{"mode":"'"${MODE:-apply}"'","profile":"'"${{ needs.set-matrix.outputs.profile }}"'","domain_name":"'"$DOMAIN_NAME"'","env_name":"'"$ENV_NAME"'"}}'
