name: Deploy Testrigs of mosip using Helmsman

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Choose deployment profile"
        required: true
        default: "mosip-platform-1.2.0.x"
        type: choice
        options:
          - mosip-platform-1.2.0.x
          - mosip-platform-1.2.1.x
          - esignet-standalone
          - esignet-standalone-2.0.0
      mode:
        description: "Choose Helmsman mode: dry-run or apply"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
      domain_name:
        description: "Domain name for this environment (e.g. example.xyz.net)"
        required: true
        type: string
      mosipid_domain_name:
        description: "MOSIP-ID domain name (e.g. mosipenv.xyz.net) — required for esignet standalone profiles"
        required: false
        type: string
      db_port:
        description: "PostgreSQL port for MOSIP platform external postgres (e.g. 5433)"
        required: false
        type: string
      esignet_db_port:
        description: "PostgreSQL port for eSignet standalone container postgres (e.g. 5432)"
        required: false
        type: string
      env_name:
        description: "Environment name (e.g. sandbox, dev, staging)"
        required: false
        type: string
      slack_channel_name:
        description: "Optional: Slack channel name for alerting (e.g. #mosip-alerts)"
        required: false
        type: string
      slack_webhook_url:
        description: "Slack webhook URL for alerting (configure as secrets.SLACK_WEBHOOK_URL in the environment)"
        required: false
        type: string
  push:
    paths:
      - Helmsman/dsf/**/testrigs-dsf.yaml

permissions:
  actions: write
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      # Push runs carry no profile input: it is resolved from the changed
      # testrigs DSF path here, once, and the deploy job reuses this output.
      - name: Checkout repository
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve profile
        id: profile
        env:
          IN_PROFILE: ${{ github.event.inputs.profile }}
          EV_BEFORE: ${{ github.event.before }}
          EV_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -n "$IN_PROFILE" ]; then
            PROFILE="$IN_PROFILE"
          else
            BASE="$EV_BEFORE"
            # New branch (before = 0000…) or force push (before not in history):
            # GitHub's paths filter compares with the default branch, so diff
            # everything this branch added since it left the default branch.
            if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE=$(git merge-base "origin/$DEFAULT_BRANCH" "$EV_SHA" 2>/dev/null || true)
              [ -n "$BASE" ] || BASE="${EV_SHA}~1"
              echo "New branch or force push: comparing with $BASE (merge-base with origin/$DEFAULT_BRANCH)"
            fi
            mapfile -t PROFILES < <(git diff --name-only "$BASE" "$EV_SHA" -- 'Helmsman/dsf/' \
              | sed -n 's|^Helmsman/dsf/\([^/]*\)/testrigs-dsf\.yaml$|\1|p' | sort -u)
            case ${#PROFILES[@]} in
              0) echo "❌ could not detect the profile: no Helmsman/dsf/<profile>/testrigs-dsf.yaml changed between $BASE and $EV_SHA"
                 exit 1 ;;
              1) PROFILE="${PROFILES[0]}" ;;
              *) echo "❌ this push changes the testrigs DSF of more than one profile: ${PROFILES[*]}"
                 echo "   Deploy them one at a time: Actions → this workflow → Run workflow, once per profile."
                 exit 1 ;;
            esac
          fi
          echo "Profile: $PROFILE"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      # Every input reaches the script through env: (never as ${{ }} in the
      # script text), so quotes or $(...) in a value are data, not shell code.
      - name: Validate required variables
        env:
          PROFILE: ${{ steps.profile.outputs.profile }}
          ENV_REF: ${{ github.ref_name }}
          DOMAIN: ${{ github.event.inputs.domain_name || vars.DOMAIN_NAME }}
          ENV_NAME_VAL: ${{ github.event.inputs.env_name || vars.ENV_NAME }}
          SLACK_CH: ${{ github.event.inputs.slack_channel_name || vars.SLACK_CHANNEL_NAME }}
          DB_PORT: ${{ github.event.inputs.db_port || vars.DB_PORT }}
          ESIGNET_DB_PORT: ${{ github.event.inputs.esignet_db_port || vars.ESIGNET_DB_PORT }}
          IN_MOSIPID_DOMAIN: ${{ github.event.inputs.mosipid_domain_name }}
          VAR_MOSIPID_DOMAIN: ${{ vars.MOSIPID_DOMAIN_NAME }}
        run: |
          errors=()
          [ -z "$DOMAIN" ]       && errors+=("domain_name is empty — set vars.DOMAIN_NAME under Environment '$ENV_REF'")
          [ -z "$ENV_NAME_VAL" ] && errors+=("env_name is empty — set vars.ENV_NAME under Environment '$ENV_REF'")
          # db_port is used only by the mosip-platform-* testrigs DSFs,
          # esignet_db_port only by the esignet-standalone* ones.
          if [[ "$PROFILE" == esignet-standalone* ]]; then
            [ -z "$ESIGNET_DB_PORT" ] && errors+=("esignet_db_port is empty — set vars.ESIGNET_DB_PORT under Environment '$ENV_REF'")
          else
            [ -z "$DB_PORT" ] && errors+=("db_port is empty — set vars.DB_PORT under Environment '$ENV_REF'")
          fi
          if [ ${#errors[@]} -gt 0 ]; then
            echo "❌ Required variables missing:"
            printf '  - %s\n' "${errors[@]}"
            echo "Go to: Settings → Environments → $ENV_REF → Variables"
            exit 1
          fi
          echo "✓ domain_name        = $DOMAIN"
          echo "✓ env_name           = $ENV_NAME_VAL"
          # Optional: no testrigs DSF uses the channel name (only SLACK_WEBHOOK_URL).
          if [ -n "$SLACK_CH" ]; then
            echo "✓ slack_channel_name = $SLACK_CH"
          else
            echo "::warning::slack_channel_name is empty — optional, testrigs only use the SLACK_WEBHOOK_URL secret"
          fi
          [ -n "$DB_PORT" ]         && echo "✓ db_port            = $DB_PORT"
          [ -n "$ESIGNET_DB_PORT" ] && echo "✓ esignet_db_port    = $ESIGNET_DB_PORT"
          # mosipid_domain_name is esignet standalone only (both esignet-standalone
          # and esignet-standalone-2.0.0 each run a single consolidated mosipid instance).
          if [[ "$PROFILE" == esignet-standalone* ]]; then
            MOSIPID_DOMAIN="${IN_MOSIPID_DOMAIN:-$VAR_MOSIPID_DOMAIN}"
            if [ -z "$MOSIPID_DOMAIN" ]; then
              echo "❌ mosipid_domain_name is required for standalone profiles"
              exit 1
            fi
            echo "✓ mosipid_domain_name = $MOSIPID_DOMAIN (esignet standalone)"
          elif [ -n "$IN_MOSIPID_DOMAIN" ]; then
            echo "⚠ mosipid_domain_name is only used for esignet standalone profiles — ignoring for profile=$PROFILE"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: validate-inputs
    environment:
      name: ${{ github.ref_name }}
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      PATH: ${{ github.workspace }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      KUBECTL_PATH: ${{ github.workspace }}/.local/bin/kubectl
      domain_name:        ${{ github.event.inputs.domain_name        || vars.DOMAIN_NAME }}
      mosipid_domain_name: ${{ github.event.inputs.mosipid_domain_name || vars.MOSIPID_DOMAIN_NAME }}
      db_port:            ${{ github.event.inputs.db_port            || vars.DB_PORT }}
      esignet_db_port:    ${{ github.event.inputs.esignet_db_port    || vars.ESIGNET_DB_PORT }}
      env_name:           ${{ github.event.inputs.env_name           || vars.ENV_NAME }}
      slack_channel_name: ${{ github.event.inputs.slack_channel_name || vars.SLACK_CHANNEL_NAME }}
      SLACK_WEBHOOK_URL:  ${{ github.event.inputs.slack_webhook_url  || secrets.SLACK_WEBHOOK_URL }}
      # esignet-standalone-2.0.0 only — esignet-apitestrig/esignet-uitestrig (the Go/Java
      # rewrite testrig charts, replacing the generic apitestrig/uitestrig charts for this
      # profile). Reused across all 3 instances (mock/mosipid/sunbird), same as
      # mock-relying-party-service's own CLIENT_ID constant in esignet-dsf.yaml.
      # Only actual credentials (passwords/client secrets) are GitHub Secrets below —
      # everything else (IDs, test identities) is a plain Environment Variable.
      #
      # These testrig-only values are optional for deployment: when unset they default to
      # the UPDATE_BEFORE_RUN placeholder so Helmsman can deploy the testrigs; set the real
      # values in the testrig configmaps/secrets before triggering the cronjobs.
      ESIGNET_UITESTRIG_OIDC_CLIENT_ID: ${{ vars.ESIGNET_UITESTRIG_OIDC_CLIENT_ID || 'UPDATE_BEFORE_RUN' }}
      ESIGNET_UITESTRIG_CLIENT_SECRET:  ${{ secrets.ESIGNET_UITESTRIG_CLIENT_SECRET || 'UPDATE_BEFORE_RUN' }}
      # Single shared Keycloak admin password (one mosip/keycloak release for the whole
      # profile — see external-dsf.yaml) — already provisioned for the MISP onboarder, so
      # no placeholder fallback here: an empty value means the real one genuinely went
      # missing, not that it was never expected to exist yet.
      MOSIPID_KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.MOSIPID_KEYCLOAK_ADMIN_PASSWORD }}
      # esignet-mosipid apitestrig/uitestrig only — config.mosip.json (apitestrig) and the
      # MOSIP-ID plugin path (uitestrig) are the only ones backed by a real IDA identity, so
      # these are the only instance that needs real test-identity/onboarding values. esignet-mock
      # (config.mock.json) and esignet-sunbird (config.sunbird.json) need none of this.
      MOSIPID_TESTRIG_INDIVIDUAL_ID:          ${{ vars.MOSIPID_TESTRIG_INDIVIDUAL_ID || 'UPDATE_BEFORE_RUN' }}
      MOSIPID_TESTRIG_OTP_RECIPIENT:          ${{ vars.MOSIPID_TESTRIG_OTP_RECIPIENT || 'UPDATE_BEFORE_RUN' }}
      MOSIPID_TESTRIG_AUTH_PARTNER_ID:        ${{ vars.MOSIPID_TESTRIG_AUTH_PARTNER_ID || 'UPDATE_BEFORE_RUN' }}
      MOSIPID_TESTRIG_AUTH_POLICY_ID:         ${{ vars.MOSIPID_TESTRIG_AUTH_POLICY_ID || 'UPDATE_BEFORE_RUN' }}
      MOSIPID_TESTRIG_UIN:                    ${{ vars.MOSIPID_TESTRIG_UIN || 'UPDATE_BEFORE_RUN' }}
      MOSIPID_TESTRIG_VID:                    ${{ vars.MOSIPID_TESTRIG_VID || 'UPDATE_BEFORE_RUN' }}
      MOSIPID_TESTRIG_PHONE_NUMBER:           ${{ vars.MOSIPID_TESTRIG_PHONE_NUMBER || 'UPDATE_BEFORE_RUN' }}
      MOSIPID_TESTRIG_EMAIL_LOGIN_ID:         ${{ vars.MOSIPID_TESTRIG_EMAIL_LOGIN_ID || 'UPDATE_BEFORE_RUN' }}
      MOSIPID_TESTRIG_PASSWORD_LOGIN_UIN:     ${{ vars.MOSIPID_TESTRIG_PASSWORD_LOGIN_UIN || 'UPDATE_BEFORE_RUN' }}
      MOSIPID_TESTRIG_PASSWORD_LOGIN_PASSWORD: ${{ secrets.MOSIPID_TESTRIG_PASSWORD_LOGIN_PASSWORD || 'UPDATE_BEFORE_RUN' }}
      # esignet-mosipid apitestrig: PMS client on the MOSIP-ID environment's Keycloak
      # (iam.<mosipid_domain_name>), and the extra values its flows need.
      MOSIPID_TESTRIG_KEYCLOAK_CLIENT_SECRET: ${{ secrets.MOSIPID_TESTRIG_KEYCLOAK_CLIENT_SECRET || 'UPDATE_BEFORE_RUN' }}
      MOSIPID_TESTRIG_FLOW_CLIENT_ID:         ${{ vars.MOSIPID_TESTRIG_FLOW_CLIENT_ID || 'UPDATE_BEFORE_RUN' }}
      MOSIPID_TESTRIG_TEST_PASSWORD:          ${{ secrets.MOSIPID_TESTRIG_TEST_PASSWORD || 'UPDATE_BEFORE_RUN' }}
      # esignet-sunbird apitestrig: Sunbird registry test identity for KBI login.
      SUNBIRD_TESTRIG_INDIVIDUAL_ID:          ${{ vars.SUNBIRD_TESTRIG_INDIVIDUAL_ID || 'UPDATE_BEFORE_RUN' }}
      SUNBIRD_TESTRIG_KBI_FULL_NAME:          ${{ vars.SUNBIRD_TESTRIG_KBI_FULL_NAME || 'UPDATE_BEFORE_RUN' }}
      SUNBIRD_TESTRIG_KBI_DOB:                ${{ vars.SUNBIRD_TESTRIG_KBI_DOB || 'UPDATE_BEFORE_RUN' }}
      # esignet apitestrig conformance surface: per-instance OpenID Conformance Suite
      # plan JSON (contains a private JWKS). Read by apitestrig-conformance-plan.sh;
      # unset = keep the plan already in the cluster, else a dummy plan.
      ESIGNET_MOCK_CONFORMANCE_PLAN:            ${{ secrets.ESIGNET_MOCK_CONFORMANCE_PLAN || 'UPDATE_BEFORE_RUN' }}
      ESIGNET_MOCK_CONFORMANCE_PLAN_FAPI2:      ${{ secrets.ESIGNET_MOCK_CONFORMANCE_PLAN_FAPI2 || 'UPDATE_BEFORE_RUN' }}
      ESIGNET_MOSIPID_CONFORMANCE_PLAN:         ${{ secrets.ESIGNET_MOSIPID_CONFORMANCE_PLAN || 'UPDATE_BEFORE_RUN' }}
      ESIGNET_MOSIPID_CONFORMANCE_PLAN_FAPI2:   ${{ secrets.ESIGNET_MOSIPID_CONFORMANCE_PLAN_FAPI2 || 'UPDATE_BEFORE_RUN' }}
      ESIGNET_SUNBIRD_CONFORMANCE_PLAN:         ${{ secrets.ESIGNET_SUNBIRD_CONFORMANCE_PLAN || 'UPDATE_BEFORE_RUN' }}
      ESIGNET_SUNBIRD_CONFORMANCE_PLAN_FAPI2:   ${{ secrets.ESIGNET_SUNBIRD_CONFORMANCE_PLAN_FAPI2 || 'UPDATE_BEFORE_RUN' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist workflow inputs as environment variables
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GH_INFRA_PAT }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ github.ref_name }}
          IN_DOMAIN_NAME: ${{ github.event.inputs.domain_name }}
          IN_MOSIPID_DOMAIN_NAME: ${{ github.event.inputs.mosipid_domain_name }}
          IN_DB_PORT: ${{ github.event.inputs.db_port }}
          IN_ESIGNET_DB_PORT: ${{ github.event.inputs.esignet_db_port }}
          IN_ENV_NAME: ${{ github.event.inputs.env_name }}
          IN_SLACK_CHANNEL_NAME: ${{ github.event.inputs.slack_channel_name }}
        run: |
          save_var() {
            local name=$1 value=$2 body
            if [ -z "$value" ]; then echo "⏭  Skipping $name — no input provided, existing value preserved"; return; fi
            # jq builds the JSON, so the value is data (no hand-built quoting).
            body=$(jq -n --arg name "$name" --arg value "$value" '{name: $name, value: $value}')
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/environments/$ENVIRONMENT/variables/$name" \
              -d "$body")
            if [ "$STATUS" = "404" ]; then
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/environments/$ENVIRONMENT/variables" \
                -d "$body")
              if [ "$STATUS" = "201" ] || [ "$STATUS" = "200" ]; then
                echo "✓ Created $name"
              else
                echo "✗ Failed to create $name (HTTP $STATUS)"; exit 1
              fi
            elif [ "$STATUS" = "200" ] || [ "$STATUS" = "204" ]; then
              echo "✓ Updated $name"
            else
              echo "✗ Failed to save $name (HTTP $STATUS)"; exit 1
            fi
          }
          save_var "DOMAIN_NAME"         "$IN_DOMAIN_NAME"
          save_var "MOSIPID_DOMAIN_NAME" "$IN_MOSIPID_DOMAIN_NAME"
          save_var "DB_PORT"             "$IN_DB_PORT"
          save_var "ESIGNET_DB_PORT"     "$IN_ESIGNET_DB_PORT"
          save_var "ENV_NAME"            "$IN_ENV_NAME"
          save_var "SLACK_CHANNEL_NAME"  "$IN_SLACK_CHANNEL_NAME"

      - name: Setup kubectl and kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          # Create directories
          mkdir -p ${{ github.workspace }}/.local/bin
          mkdir -p ${{ github.workspace }}/.kube
          
          # Install kubectl
          curl -LO https://dl.k8s.io/release/v1.31.3/bin/linux/amd64/kubectl
          chmod +x kubectl
          mv ./kubectl ${{ github.workspace }}/.local/bin/kubectl
          
          # Setup kubeconfig
          echo "$KUBECONFIG_CONTENT" > ${{ github.workspace }}/.kube/config
          chmod 400 ${{ github.workspace }}/.kube/config
          
          # Add kubectl to GitHub PATH for subsequent steps
          echo "${{ github.workspace }}/.local/bin" >> $GITHUB_PATH
          
          # Export environment variables for immediate use
          echo "KUBECTL_PATH=${{ github.workspace }}/.local/bin/kubectl" >> $GITHUB_ENV
          
          # Verify installation
          ${{ github.workspace }}/.local/bin/kubectl version --client
          ${{ github.workspace }}/.local/bin/kubectl config view

      - name: Set Default Mode
        env:
          IN_MODE: ${{ github.event.inputs.mode }}
        run: |
          echo "HELMSMAN_MODE=${IN_MODE:-apply}" >> "$GITHUB_ENV"

      - name: Set Profile
        env:
          # resolved once in validate-inputs (input, or the changed testrigs DSF on push)
          PROFILE: ${{ needs.validate-inputs.outputs.profile }}
        run: |
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "Using profile: $PROFILE"

      - name: Setup ufw firewall
        run: |
          sudo ufw enable
          sudo ufw allow ssh
          sudo ufw allow 51820/udp
          sudo ufw status  

      - name: Install WireGuard
        run: sudo apt-get install -y wireguard

      - name: Configure WireGuard
        env:
          WG0_CONF: ${{ secrets.CLUSTER_WIREGUARD_WG0 }}
        run: |
          # via env: (not pasted into the script); tee to /dev/null so the config
          # is not echoed into the job log
          printf '%s\n' "$WG0_CONF" | sudo tee /etc/wireguard/wg0.conf > /dev/null

      - name: Start WireGuard
        run: |
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo chmod 700 /etc/wireguard/
          sudo chmod 644 /lib/systemd/system/wg-quick@.service
          sudo systemctl daemon-reload
          sudo wg-quick up wg0
          sudo wg show wg0

      - name: Setup Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3
          sudo chmod 700 get_helm.sh
          sudo ./get_helm.sh
          helm version --client

      - name: Install Helmsman
        run: |
          curl -L https://github.com/Praqma/helmsman/releases/download/v3.17.1/helmsman_3.17.1_linux_amd64.tar.gz -o helmsman.tar.gz
          tar xzf helmsman.tar.gz
          sudo mv helmsman /usr/local/bin
          
          # Verify tools are available
          echo "Tools verification:"
          echo "kubectl: $(which kubectl)"
          echo "helmsman: $(which helmsman)"
          
          kubectl version --client
          helmsman -v       

      - name: Verify cluster access
        run: |
          # Verify tools are accessible
          echo "Verifying tool availability:"
          echo "kubectl path: $(which kubectl)"
          echo "KUBECONFIG: $KUBECONFIG"
          
          # Test kubectl functionality
          kubectl version --client
          kubectl get nodes
          kubectl cluster-info
      - name: Get MinIO root password (esignet profile)
        if: startsWith(env.PROFILE, 'esignet-standalone')
        run: |
          if kubectl -n minio get secret minio &>/dev/null; then
            MINIO_ROOT_PASSWORD=$(kubectl -n minio get secret minio -o jsonpath='{.data.root-password}' | base64 -d)
            if [ -n "$MINIO_ROOT_PASSWORD" ]; then
              echo "::add-mask::$MINIO_ROOT_PASSWORD"
              # 2.0.0 apitestrig puts it into the uploader's MC_HOST_target URL
              # (scheme://user:pass@host) unencoded, so anything but [A-Za-z0-9]
              # (@ : / # % ? space ...) can break report upload.
              if [ "$PROFILE" = "esignet-standalone-2.0.0" ] && [[ ! "$MINIO_ROOT_PASSWORD" =~ ^[A-Za-z0-9]+$ ]]; then
                echo "❌ minio root-password is not alphanumeric - apitestrig S3 report upload cannot use it. Set an alphanumeric root-password."; exit 1
              fi
              echo "MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD" >> $GITHUB_ENV
              echo "✅ MINIO_ROOT_PASSWORD retrieved"
            else
              echo "❌ root-password is empty in minio/minio secret"; exit 1
            fi
          else
            echo "❌ secret minio not found in minio namespace"; exit 1
          fi

      - name: Get PMS client secret (esignet-standalone-2.0.0 apitestrig)
        if: env.PROFILE == 'esignet-standalone-2.0.0'
        run: |
          # esignet-apitestrig's KEYCLOAK_CLIENT_SECRET is the same mosip-pms-client secret
          # esignet-preinstall-keycloak-init.sh/esignet-postinstall-keycloak-init.sh already use
          # (PMS_CLIENT_SECRET_KEY='mosip_pms_client_secret') — by the time testrigs run, eSignet
          # DSF has already completed, so keycloak-client-secrets is guaranteed to exist.
          if ! kubectl -n keycloak get secret keycloak-client-secrets &>/dev/null; then
            echo "❌ keycloak-client-secrets not found in keycloak namespace"; exit 1
          fi
          PMS_CLIENT_SECRET_VALUE=$(kubectl -n keycloak get secret keycloak-client-secrets \
            -o jsonpath='{.data.mosip_pms_client_secret}' | base64 -d)
          if [ -z "$PMS_CLIENT_SECRET_VALUE" ]; then
            echo "❌ mosip_pms_client_secret is empty in keycloak-client-secrets"; exit 1
          fi
          echo "::add-mask::$PMS_CLIENT_SECRET_VALUE"
          echo "PMS_CLIENT_SECRET_VALUE=$PMS_CLIENT_SECRET_VALUE" >> $GITHUB_ENV
          echo "✅ PMS_CLIENT_SECRET_VALUE retrieved"

      - name: Get consent DB password (esignet-standalone-2.0.0 uitestrig)
        if: env.PROFILE == 'esignet-standalone-2.0.0'
        run: |
          # esignet-uitestrig's esignetDbPassword — same db-common-secrets/db-dbuser-password
          # helmsman_esignet.yml's own "Get DB User Password" step already reads.
          if ! kubectl -n postgres get secret db-common-secrets &>/dev/null; then
            echo "❌ db-common-secrets not found in postgres namespace"; exit 1
          fi
          DB_USER_PASSWORD=$(kubectl -n postgres get secret db-common-secrets \
            -o jsonpath='{.data.db-dbuser-password}' | base64 -d)
          if [ -z "$DB_USER_PASSWORD" ]; then
            echo "❌ db-dbuser-password is empty in db-common-secrets"; exit 1
          fi
          echo "::add-mask::$DB_USER_PASSWORD"
          echo "DB_USER_PASSWORD=$DB_USER_PASSWORD" >> $GITHUB_ENV
          echo "✅ DB_USER_PASSWORD retrieved"

      - name: Check if mosip-dsf label is completed
        if: ${{ !startsWith(env.PROFILE, 'esignet-standalone') }}
        run: |
          STATUS=$(kubectl get namespace default -o jsonpath='{.metadata.labels.mosip-dsf}')
          if [[ "$STATUS" != "completed" ]]; then
            echo "❌ MOSIP DSF not completed."
            exit 1
          fi

      - name: Check if esignet-dsf label is completed
        if: startsWith(env.PROFILE, 'esignet-standalone')
        run: |
          STATUS=$(kubectl get namespace default -o jsonpath='{.metadata.labels.esignet-dsf}' 2>/dev/null || echo "")
          if [[ "$STATUS" != "completed" ]]; then
            echo "❌ eSignet DSF not completed. Run helmsman_esignet.yml first."
            exit 1
          fi
          echo "✅ eSignet DSF is completed. Proceeding with testrig deployment."
      - name: Show deployment variables
        run: |
          echo "domain_name        = $domain_name"
          echo "env_name           = $env_name"
          echo "slack_channel_name = $slack_channel_name"

      - name: Conformance plan notes (esignet-standalone-2.0.0)
        if: env.PROFILE == 'esignet-standalone-2.0.0'
        run: |
          {
            echo "### eSignet apitestrig conformance plans"
            echo "- The \`esignet-conformance-plan\` Secret is written only when Helmsman installs or upgrades an apitestrig release."
            echo "- A real plan already on the cluster is **kept**; the \`ESIGNET_*_CONFORMANCE_PLAN*\` GitHub secrets only seed an empty or dummy plan."
            echo "- To change a plan, edit the Secret in the instance namespace. To re-seed from GitHub, delete that key (or the Secret) and re-deploy."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Initiate helmsman to apply the DSF configurations
        run: |
          export HOME="${{ github.workspace }}"
          export WORKDIR="$HOME/Helmsman"

          # Verify tools are available
          echo "Using kubectl: $(which kubectl)"
          echo "Using kubeconfig: $KUBECONFIG"

          # Run helmsman with the determined mode and profile
          echo "Using profile: $PROFILE"
          helmsman --${HELMSMAN_MODE} --keep-untracked-releases -f $WORKDIR/dsf/${PROFILE}/testrigs-dsf.yaml
