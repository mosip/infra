# Documentation site (mkdocs.yml at the repo root).
#
# - Pull requests: the workflow form images must match the workflows, then a
#   strict build (broken links or anchors fail the check).
# - Push to develop, or a manual run on develop: build and publish to GitHub Pages.
# - A fork: a manual run from any branch publishes a preview to the fork's
#   Pages (https://<user>.github.io/infra/) — mosip/infra itself only
#   publishes develop.
#
# One-time setup (repository admin, or the fork owner for a preview):
# Settings → Pages → Source: GitHub Actions, and allow the branch under
# Settings → Environments → github-pages.
name: docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/mkdocs/**'
      - '.github/workflows/**'   # inputs drive docs/_images/workflows/*.svg
  push:
    branches:
      - develop
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/mkdocs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Workflow form images up to date
        run: python .github/mkdocs/render_workflow_forms.py --check

      - name: Build (strict)
        run: mkdocs build --strict --site-dir site

      - name: Upload site
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    # mosip/infra: develop only. Forks: any branch on a manual run (preview).
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || (github.repository != 'mosip/infra' && github.event_name == 'workflow_dispatch')) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
