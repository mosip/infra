# MOSIP infrastructure: plan / apply
#
# One Terraform root per component, each with its own state:
#   terraform/implementations/<cloud>/<component>
# Values come from profiles/<PROFILE>/<cloud>/{common,<component>}.tfvars;
# Layer 3 (nginx, rke2, nfs, ...) is configured by Ansible (ansible/site.yml)
# in the `configure` job.
#
# COMPONENT=all runs everything in the legacy order and requires
# TERRAFORM_APPLY (later components look up what earlier ones created):
#   security → iam → compute → storage → dns → configure
# Any single component can be run on its own for day-2 changes, e.g. dns
# to update only Route53 records. `vm` (standalone EC2 + SG + IAM from
# profiles/<p>/aws/vm.tfvars) is separate and never part of `all`.
#
# Local backend: state is GPG-encrypted (GPG_PASSPHRASE) and committed to
# the branch. See docs/DEPLOYMENT_SEQUENCE.md and docs/PROFILES.md.
name: terraform plan / apply

on:
  workflow_dispatch:
    inputs:
      CLOUD_PROVIDER:
        description: 'Cloud provider (azure/gcp: base-infra only)'
        required: true
        type: choice
        options: [aws, azure, gcp]
      COMPONENT:
        description: 'What to run. all = every component in order, then configure. vm = standalone EC2+SG+IAM. base-infra = one-time VPC/WireGuard.'
        required: true
        type: choice
        options: [all, security, iam, compute, storage, dns, configure, vm, base-infra]
        default: all
      PROFILE:
        description: 'Deployment shape (profiles/<name>) — ignored for base-infra'
        required: true
        type: choice
        options: [mosip, esignet-standalone, observ]
        default: mosip
      BACKEND_TYPE:
        description: 'Terraform backend type'
        required: true
        type: choice
        options: [local, remote]
        default: local
      REMOTE_BACKEND_CONFIG:
        description: 'Remote backend config (aws:bucket_base_name:region | azure:rg:storage_account:container | gcp:bucket)'
        required: false
        type: string
      ENABLE_STATE_LOCKING:
        description: 'Enable state locking (recommended for remote backends)'
        required: false
        type: boolean
        default: false
      SSH_PRIVATE_KEY:
        description: 'Name of the GitHub secret holding the SSH private key for the nodes'
        required: true
        type: string
      TERRAFORM_APPLY:
        description: 'Apply (unchecked = plan only). Required for all/configure.'
        required: false
        type: boolean
        default: false
      ENABLE_RANCHER_IMPORT:
        description: 'Register the cluster in Rancher via API (RANCHER_API_URL + RANCHER_API_TOKEN secrets)'
        required: false
        type: boolean
        default: false
      RANCHER_CLUSTER_NAME:
        description: 'Rancher cluster name (defaults to branch/env name)'
        required: false
        type: string
      PUBLISH_KUBECONFIG:
        description: 'After import, fetch kubeconfig from Rancher and set the KUBECONFIG env secret'
        required: false
        type: boolean
        default: true
      GRANT_GROUP_ACCESS:
        description: 'Also grant other teams from rancher-access-grants.json. DEVOPS cluster-owner is always applied.'
        required: false
        type: boolean
        default: false
      RANCHER_CLUSTER_OWNER_GROUP_ENABLED:
        description: 'Grant an additional group cluster-owner access (DEVOPS stays cluster-owner too)'
        required: false
        type: boolean
        default: false
      RANCHER_CLUSTER_OWNER_GROUP:
        description: 'Group name for cluster-owner override (e.g. QA)'
        required: false
        type: string
        default: ''

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input combination
        run: |
          set -euo pipefail
          C="${{ inputs.COMPONENT }}"
          if [ "${{ inputs.CLOUD_PROVIDER }}" != "aws" ] && [ "$C" != "base-infra" ]; then
            echo "ERROR: only base-infra exists for ${{ inputs.CLOUD_PROVIDER }}; components are AWS-only today."
            echo "Data-centre VMs need no Terraform: see docs/DEPLOYMENT_SEQUENCE.md."
            exit 1
          fi
          if { [ "$C" = "all" ] || [ "$C" = "configure" ]; } && [ "${{ inputs.TERRAFORM_APPLY }}" != "true" ]; then
            echo "ERROR: COMPONENT=$C needs TERRAFORM_APPLY=true (later steps look up what earlier ones created)."
            exit 1
          fi
          echo "OK: ${{ inputs.CLOUD_PROVIDER }} / $C / profile ${{ inputs.PROFILE }}"

  base-infra:
    needs: validate
    if: ${{ inputs.COMPONENT == 'base-infra' }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: base-infra
      ACTION: apply
      CONFIRM: ${{ inputs.TERRAFORM_APPLY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}
      SSH_PRIVATE_KEY: ${{ inputs.SSH_PRIVATE_KEY }}

  # ---- components, in dependency order --------------------------------
  # Each runs when selected on its own, or as part of `all` once the
  # previous one succeeded.

  security:
    needs: validate
    if: ${{ inputs.COMPONENT == 'security' || inputs.COMPONENT == 'all' }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: security
      PROFILE: ${{ inputs.PROFILE }}
      ACTION: apply
      CONFIRM: ${{ inputs.TERRAFORM_APPLY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}

  iam:
    needs: [validate, security]
    if: ${{ always() && needs.validate.result == 'success' && (inputs.COMPONENT == 'iam' || (inputs.COMPONENT == 'all' && needs.security.result == 'success')) }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: iam
      PROFILE: ${{ inputs.PROFILE }}
      ACTION: apply
      CONFIRM: ${{ inputs.TERRAFORM_APPLY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}

  compute:
    needs: [validate, iam]
    if: ${{ always() && needs.validate.result == 'success' && (inputs.COMPONENT == 'compute' || (inputs.COMPONENT == 'all' && needs.iam.result == 'success')) }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: compute
      PROFILE: ${{ inputs.PROFILE }}
      ACTION: apply
      CONFIRM: ${{ inputs.TERRAFORM_APPLY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}

  storage:
    needs: [validate, compute]
    if: ${{ always() && needs.validate.result == 'success' && (inputs.COMPONENT == 'storage' || (inputs.COMPONENT == 'all' && needs.compute.result == 'success')) }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: storage
      PROFILE: ${{ inputs.PROFILE }}
      ACTION: apply
      CONFIRM: ${{ inputs.TERRAFORM_APPLY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}

  dns:
    needs: [validate, storage]
    if: ${{ always() && needs.validate.result == 'success' && (inputs.COMPONENT == 'dns' || (inputs.COMPONENT == 'all' && needs.storage.result == 'success')) }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: dns
      PROFILE: ${{ inputs.PROFILE }}
      ACTION: apply
      CONFIRM: ${{ inputs.TERRAFORM_APPLY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}

  vm:
    needs: validate
    if: ${{ inputs.COMPONENT == 'vm' }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: vm
      PROFILE: ${{ inputs.PROFILE }}
      ACTION: apply
      CONFIRM: ${{ inputs.TERRAFORM_APPLY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}

  # ---- Layer 3: Ansible ------------------------------------------------
  # DNS is applied before this (legacy order: DNS → nginx); the preflight
  # play in site.yml re-checks it. Needs SSH to the private nodes, hence
  # WireGuard — the Terraform jobs above only call cloud APIs.
  configure:
    needs: [validate, dns]
    if: ${{ always() && needs.validate.result == 'success' && (inputs.COMPONENT == 'configure' || (inputs.COMPONENT == 'all' && needs.dns.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: terraform-configure-${{ inputs.CLOUD_PROVIDER }}-${{ inputs.PROFILE }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      PROFILE_DIR: ${{ github.workspace }}/profiles/${{ inputs.PROFILE }}
      RANCHER_URL: ${{ secrets.RANCHER_API_URL }}
      RANCHER_TOKEN: ${{ secrets.RANCHER_API_TOKEN }}
      RANCHER_CLUSTER_NAME: ${{ inputs.RANCHER_CLUSTER_NAME || github.ref_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_INFRA_PAT }}

      - name: Ensure workflow scripts are executable
        run: chmod +x .github/scripts/*.sh

      - name: Install WireGuard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wireguard

      - name: Configure WireGuard
        env:
          TF_WG_CONFIG: ${{ secrets.TF_WG_CONFIG }}
        run: |
          if [ ${#TF_WG_CONFIG} -eq 0 ]; then
            echo "ERROR: TF_WG_CONFIG secret is not configured for environment '$REF_NAME'"
            exit 1
          fi
          sudo mkdir -p /etc/wireguard
          sudo chmod 700 /etc/wireguard
          sudo install -m 600 -o root -g root /dev/null /etc/wireguard/wg0.conf
          printf '%s' "$TF_WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          if ! sudo grep -q "\[Interface\]" /etc/wireguard/wg0.conf; then
            echo "ERROR: WireGuard config missing [Interface] section"
            exit 1
          fi

      - name: Start WireGuard
        run: |
          sudo systemctl daemon-reload
          sudo wg-quick up wg0 || { echo "ERROR: Failed to start WireGuard VPN"; exit 1; }
          sudo wg show wg0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: v1.8.5
          terraform_wrapper: false

      - name: Setup GPG
        run: |
          .github/scripts/setup-gpg.sh \
            --backend-type "${{ inputs.BACKEND_TYPE }}" \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}"

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes --update ppa:ansible/ansible
          sudo apt-get install -y ansible python3-yaml jq
          ansible --version
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write SSH private key
        env:
          SSH_KEY_CONTENT: ${{ secrets[inputs.SSH_PRIVATE_KEY] }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ansible_ssh_key"
          printf '%s' "$SSH_KEY_CONTENT" > "$RUNNER_TEMP/ansible_ssh_key"

      # Only compute (hosts) and storage (which data volumes exist) feed the
      # inventory; the other components have nothing Ansible needs.
      - name: Read compute + storage outputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tf-outputs"
          for component in compute storage; do
            pushd "terraform/implementations/${{ inputs.CLOUD_PROVIDER }}/$component" > /dev/null
            "$GITHUB_WORKSPACE/.github/scripts/configure-backend.sh" \
              --type "${{ inputs.BACKEND_TYPE }}" \
              --provider "${{ inputs.CLOUD_PROVIDER }}" \
              --component "$component" \
              --branch "$REF_NAME" \
              --remote-config "${{ inputs.REMOTE_BACKEND_CONFIG }}" \
              ${{ inputs.ENABLE_STATE_LOCKING && '--enable-locking' || '' }} \
              --profile "${{ inputs.PROFILE }}" > /dev/null
            "$GITHUB_WORKSPACE/.github/scripts/decrypt-state.sh" \
              --backend-type "${{ inputs.BACKEND_TYPE }}" \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --operation apply > /dev/null
            terraform init -input=false > /dev/null
            if ! terraform output -json > "$RUNNER_TEMP/tf-outputs/$component.json"; then
              echo "ERROR: no outputs for '$component' — apply it first (COMPONENT=$component, TERRAFORM_APPLY=true)."
              exit 1
            fi
            popd > /dev/null
          done

      - name: Render Ansible inventory
        run: |
          python3 ansible/inventory/generate.py \
            --profile "$PROFILE_DIR" \
            --from-terraform "$RUNNER_TEMP/tf-outputs" \
            --tfvars "$PROFILE_DIR/${{ inputs.CLOUD_PROVIDER }}/common.tfvars" \
            --set "ansible_ssh_private_key_file=$RUNNER_TEMP/ansible_ssh_key" \
            -o inventory.yml
          cat inventory.yml

      - name: Mint Rancher import command
        id: rancher_import
        if: ${{ inputs.ENABLE_RANCHER_IMPORT }}
        run: |
          set -euo pipefail
          if ! grep -q '^ *- rancher_import$' "$PROFILE_DIR/profile.yml"; then
            echo "Profile ${{ inputs.PROFILE }} doesn't run rancher_import — skipping."
            exit 0
          fi
          if [ -z "$RANCHER_URL" ] || [ -z "$RANCHER_TOKEN" ]; then
            echo "ERROR: RANCHER_API_URL and RANCHER_API_TOKEN must be set for environment '$REF_NAME'"
            exit 1
          fi
          IMPORT_CMD="$(.github/scripts/rancher-register-cluster.sh \
            --rancher-url "$RANCHER_URL" \
            --token "$RANCHER_TOKEN" \
            --cluster-name "$RANCHER_CLUSTER_NAME" | tail -n1)"
          [[ -n "$IMPORT_CMD" ]] || { echo "ERROR: Rancher registration returned empty import command"; exit 1; }
          echo "::add-mask::$IMPORT_CMD"
          echo "rancher_import_url=$IMPORT_CMD" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Order (preflight → nginx → rke2 → rancher import → nfs → postgresql →
      # activemq → rancher/keycloak) lives in site.yml; the profile only
      # selects components. Secrets go through a 0600 file, not argv.
      - name: Configure (ansible/site.yml)
        env:
          RANCHER_IMPORT_URL: ${{ steps.rancher_import.outputs.rancher_import_url }}
          RANCHER_BOOTSTRAP_PASSWORD: ${{ secrets.RANCHER_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          EXTRA="$RUNNER_TEMP/extra-vars.json"
          install -m 600 /dev/null "$EXTRA"
          python3 - "$EXTRA" <<'EOF'
          import json, os, sys
          extra = {}
          if os.environ.get("RANCHER_IMPORT_URL"):
              extra["enable_rancher_import"] = True
              extra["rancher_import_url"] = os.environ["RANCHER_IMPORT_URL"]
          if os.environ.get("RANCHER_BOOTSTRAP_PASSWORD"):
              extra["rancher_password"] = os.environ["RANCHER_BOOTSTRAP_PASSWORD"]
          with open(sys.argv[1], "w") as fh:
              json.dump(extra, fh)
          EOF
          ansible-playbook -i inventory.yml ansible/site.yml -e "@$EXTRA"
          rm -f "$EXTRA"

      # ---- Rancher follow-ups (same as develop's legacy flow) ----------
      - name: Apply Rancher import on cluster (fresh token)
        if: ${{ steps.rancher_import.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          CONTROL_PLANE_IP="$(jq -r '.k8s_primary_control_plane_ip.value' "$RUNNER_TEMP/tf-outputs/compute.json")"
          CLUSTER_TF_NAME="$(python3 -c "import yaml; print(yaml.safe_load(open('inventory.yml'))['all']['vars']['cluster_name'])")"
          .github/scripts/rancher-register-cluster.sh \
            --rancher-url "$RANCHER_URL" \
            --token "$RANCHER_TOKEN" \
            --cluster-name "$RANCHER_CLUSTER_NAME" \
            --apply-on-host \
            --ssh-key "$RUNNER_TEMP/ansible_ssh_key" \
            --ssh-host "$CONTROL_PLANE_IP" \
            --kubeconfig-remote "/home/ubuntu/.kube/${CLUSTER_TF_NAME}-CONTROL-PLANE-NODE-1.yaml"

      - name: Grant Rancher cluster access (multi-team)
        if: ${{ steps.rancher_import.outputs.enabled == 'true' }}
        continue-on-error: true
        env:
          RANCHER_ACCESS_GRANTS: ${{ vars.RANCHER_ACCESS_GRANTS }}
          RANCHER_DEVOPS_ROLE: ${{ vars.RANCHER_DEVOPS_ROLE }}
          RANCHER_DEVOPS_ENABLED: ${{ vars.RANCHER_DEVOPS_ENABLED }}
          RANCHER_DEVOPS_GROUP: ${{ vars.RANCHER_DEVOPS_GROUP }}
          RANCHER_GROUP_AUTH_PREFIX: ${{ vars.RANCHER_GROUP_AUTH_PREFIX }}
          WORKFLOW_DEVOPS_GROUP: ${{ vars.RANCHER_DEVOPS_GROUP || 'DEVOPS' }}
          WORKFLOW_GRANT_GROUP_ACCESS: ${{ inputs.GRANT_GROUP_ACCESS }}
          WORKFLOW_CLUSTER_OWNER_GROUP_ENABLED: ${{ inputs.RANCHER_CLUSTER_OWNER_GROUP_ENABLED }}
          WORKFLOW_CLUSTER_OWNER_GROUP: ${{ inputs.RANCHER_CLUSTER_OWNER_GROUP }}
        run: |
          ARGS=(--rancher-url "$RANCHER_URL" --token "$RANCHER_TOKEN" --cluster-name "$RANCHER_CLUSTER_NAME" --apply-catalog)
          if [ -n "${RANCHER_GROUP_AUTH_PREFIX:-}" ]; then
            ARGS+=(--default-group-auth-prefix "$RANCHER_GROUP_AUTH_PREFIX")
          fi
          .github/scripts/rancher-grant-cluster-access.sh "${ARGS[@]}"

      - name: Publish KUBECONFIG from Rancher
        if: ${{ steps.rancher_import.outputs.enabled == 'true' && inputs.PUBLISH_KUBECONFIG }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_INFRA_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The import step waits for cattle-cluster-agent; allow ~6 min for Rancher state=active
          MAX_ATTEMPTS: "24"
          SLEEP_SECONDS: "15"
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "ERROR: GH_INFRA_PAT is required to publish KUBECONFIG"; exit 1; }
          if ! KUBECONFIG_CONTENT="$(.github/scripts/rancher-fetch-kubeconfig.sh \
            --rancher-url "$RANCHER_URL" \
            --token "$RANCHER_TOKEN" \
            --cluster-name "$RANCHER_CLUSTER_NAME")"; then
            echo "ERROR: Rancher cluster '$RANCHER_CLUSTER_NAME' did not become active in time."
            echo "Check: the 'Apply Rancher import' step, kubectl get pods -n cattle-system, and the Rancher UI."
            exit 1
          fi
          printf '%s' "$KUBECONFIG_CONTENT" | gh secret set KUBECONFIG --env "$REF_NAME" --repo "$GITHUB_REPOSITORY"
          echo "Published KUBECONFIG environment secret for: $REF_NAME"

      - name: Clean up SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/ansible_ssh_key"

      - uses: 8398a7/action-slack@v3
        continue-on-error: true
        if: ${{ failure() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,author,commit,workflow,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
