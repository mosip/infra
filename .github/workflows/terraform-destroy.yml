# MOSIP infrastructure: destroy
#
# Destroys one component, or all of them in REVERSE dependency order:
#   dns → storage → compute → iam → security   (+ vm, independent)
# Without TERRAFORM_DESTROY checked, every selected component only runs
# `terraform plan -destroy`.
#
# Data-centre VMs aren't managed by Terraform; there is nothing to destroy
# here for them.
name: terraform destroy

on:
  workflow_dispatch:
    inputs:
      CLOUD_PROVIDER:
        description: 'Cloud provider (azure/gcp: base-infra only)'
        required: true
        type: choice
        options: [aws, azure, gcp]
      COMPONENT:
        description: 'What to destroy. all = every component, reverse order. base-infra removes the VPC/WireGuard!'
        required: true
        type: choice
        options: [all, dns, storage, compute, iam, security, vm, base-infra]
        default: all
      PROFILE:
        description: 'Deployment shape (profiles/<name>) — ignored for base-infra'
        required: true
        type: choice
        options: [mosip, esignet-standalone, observ]
        default: mosip
      BACKEND_TYPE:
        description: 'Terraform backend type (must match the one used to create)'
        required: true
        type: choice
        options: [local, remote]
        default: local
      REMOTE_BACKEND_CONFIG:
        description: 'Remote backend config (aws:bucket_base_name:region | azure:rg:storage_account:container | gcp:bucket)'
        required: false
        type: string
      ENABLE_STATE_LOCKING:
        description: 'State locking (must match the setting used to create)'
        required: false
        type: boolean
        default: false
      SSH_PRIVATE_KEY:
        description: 'Name of the GitHub secret holding the SSH private key (base-infra only)'
        required: false
        type: string
      TERRAFORM_DESTROY:
        description: 'CONFIRM DESTRUCTION (unchecked = plan -destroy only)'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input combination
        run: |
          if [ "${{ inputs.CLOUD_PROVIDER }}" != "aws" ] && [ "${{ inputs.COMPONENT }}" != "base-infra" ]; then
            echo "ERROR: only base-infra exists for ${{ inputs.CLOUD_PROVIDER }}."
            exit 1
          fi
          echo "Destroying ${{ inputs.CLOUD_PROVIDER }} / ${{ inputs.COMPONENT }} / ${{ inputs.PROFILE }} (confirm=${{ inputs.TERRAFORM_DESTROY }})"

  base-infra:
    needs: validate
    if: ${{ inputs.COMPONENT == 'base-infra' }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: base-infra
      ACTION: destroy
      CONFIRM: ${{ inputs.TERRAFORM_DESTROY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}
      SSH_PRIVATE_KEY: ${{ inputs.SSH_PRIVATE_KEY }}

  vm:
    needs: validate
    if: ${{ inputs.COMPONENT == 'vm' || inputs.COMPONENT == 'all' }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: vm
      PROFILE: ${{ inputs.PROFILE }}
      ACTION: destroy
      CONFIRM: ${{ inputs.TERRAFORM_DESTROY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}

  dns:
    needs: validate
    if: ${{ inputs.COMPONENT == 'dns' || inputs.COMPONENT == 'all' }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: dns
      PROFILE: ${{ inputs.PROFILE }}
      ACTION: destroy
      CONFIRM: ${{ inputs.TERRAFORM_DESTROY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}

  storage:
    needs: [validate, dns]
    if: ${{ always() && needs.validate.result == 'success' && (inputs.COMPONENT == 'storage' || (inputs.COMPONENT == 'all' && needs.dns.result == 'success')) }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: storage
      PROFILE: ${{ inputs.PROFILE }}
      ACTION: destroy
      CONFIRM: ${{ inputs.TERRAFORM_DESTROY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}

  compute:
    needs: [validate, storage]
    if: ${{ always() && needs.validate.result == 'success' && (inputs.COMPONENT == 'compute' || (inputs.COMPONENT == 'all' && needs.storage.result == 'success')) }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: compute
      PROFILE: ${{ inputs.PROFILE }}
      ACTION: destroy
      CONFIRM: ${{ inputs.TERRAFORM_DESTROY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}

  iam:
    needs: [validate, compute]
    if: ${{ always() && needs.validate.result == 'success' && (inputs.COMPONENT == 'iam' || (inputs.COMPONENT == 'all' && needs.compute.result == 'success')) }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: iam
      PROFILE: ${{ inputs.PROFILE }}
      ACTION: destroy
      CONFIRM: ${{ inputs.TERRAFORM_DESTROY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}

  security:
    needs: [validate, iam]
    if: ${{ always() && needs.validate.result == 'success' && (inputs.COMPONENT == 'security' || (inputs.COMPONENT == 'all' && needs.iam.result == 'success')) }}
    uses: ./.github/workflows/terraform-component.yml
    secrets: inherit
    with:
      CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
      COMPONENT: security
      PROFILE: ${{ inputs.PROFILE }}
      ACTION: destroy
      CONFIRM: ${{ inputs.TERRAFORM_DESTROY }}
      BACKEND_TYPE: ${{ inputs.BACKEND_TYPE }}
      REMOTE_BACKEND_CONFIG: ${{ inputs.REMOTE_BACKEND_CONFIG }}
      ENABLE_STATE_LOCKING: ${{ inputs.ENABLE_STATE_LOCKING }}
