name: route53 dns upsert

on:
  workflow_dispatch:
    inputs:
      RECORD_NAME:
        description: 'Full DNS record name (FQDN with trailing dot optional)'
        required: true
        type: string
      CNAME_TARGET:
        description: 'CNAME target hostname'
        required: true
        type: string
        default: 'api.esperf.mosip.net'
      HOSTED_ZONE_ID:
        description: 'Route53 hosted zone ID'
        required: true
        type: string
        default: 'Z090954828SJIEL6P5406'
      TTL:
        description: 'DNS TTL in seconds'
        required: false
        type: string
        default: '300'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ap-south-1

jobs:
  upsert-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Install AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq awscli

      - name: Upsert Route53 CNAME record
        run: |
          RECORD_NAME="${{ inputs.RECORD_NAME }}"
          CNAME_TARGET="${{ inputs.CNAME_TARGET }}"
          if [[ "$RECORD_NAME" != *. ]]; then
            RECORD_NAME="${RECORD_NAME}."
          fi
          if [[ "$CNAME_TARGET" != *. ]]; then
            CNAME_TARGET="${CNAME_TARGET}."
          fi
          aws route53 change-resource-record-sets \
            --hosted-zone-id "${{ inputs.HOSTED_ZONE_ID }}" \
            --change-batch "$(cat <<EOF
          {
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "${RECORD_NAME}",
                  "Type": "CNAME",
                  "TTL": ${{ inputs.TTL }},
                  "ResourceRecords": [
                    { "Value": "${CNAME_TARGET}" }
                  ]
                }
              }
            ]
          }
          EOF
          )"
          echo "Upserted ${RECORD_NAME} -> ${CNAME_TARGET}"

      - name: Verify DNS record
        run: |
          sleep 5
          RECORD_NAME="${{ inputs.RECORD_NAME }}"
          RECORD_NAME="${RECORD_NAME%.}"
          dig +short "$RECORD_NAME" CNAME || true
          dig +short "$RECORD_NAME" A || true
