<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1528" viewBox="0 0 460 1528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Deploy External services of mosip using Helmsman — Run workflow form">
<title>Deploy External services of mosip using Helmsman — Run workflow form</title>
<rect x="0.5" y="0.5" width="459" height="1501" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="16" y="30" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Run workflow</text>
<text x="16" y="58" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">Use workflow from</text>
<rect x="16" y="66" width="190" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="26" y="85" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Branch: &lt;your branch&gt; ▾</text>
<circle cx="27" cy="122" r="10" fill="#0969da"/>
<text x="27" y="126" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<text x="46" y="126" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Deployment profile to use<tspan fill="#d1242f" font-weight="600"> *</tspan></text>
<rect x="46" y="134" width="398" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="56" y="153" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">mosip-platform-1.2.0.x</text>
<text x="434" y="153" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="end">▾</text>
<text x="420" y="153" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">profile</text>
<text x="46" y="177" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">other options: mosip-platform-1.2.1.x | esignet-standalone</text>
<circle cx="27" cy="200" r="10" fill="#0969da"/>
<text x="27" y="204" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="46" y="204" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Choose Helmsman mode: dry-run or apply<tspan fill="#d1242f" font-weight="600"> *</tspan></text>
<rect x="46" y="212" width="398" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="56" y="231" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">dry-run</text>
<text x="434" y="231" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="end">▾</text>
<text x="420" y="231" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">mode</text>
<text x="46" y="255" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">other options: apply</text>
<circle cx="27" cy="278" r="10" fill="#0969da"/>
<text x="27" y="282" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<text x="46" y="282" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Domain name for this environment (e.g. example.xyz.net)<tspan fill="#d1242f" font-weight="600"> *</tspan></text>
<rect x="46" y="290" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="309" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">domain_name</text>
<circle cx="27" cy="342" r="10" fill="#0969da"/>
<text x="27" y="346" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
<text x="46" y="346" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">PostgreSQL port for MOSIP platform external postgres (e.g. 5433)<tspan fill="#d1242f" font-weight="600"> *</tspan></text>
<rect x="46" y="354" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="373" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">db_port</text>
<circle cx="27" cy="406" r="10" fill="#0969da"/>
<text x="27" y="410" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
<text x="46" y="410" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Optional: PostgreSQL port for the eSignet standalone postgres</text>
<text x="46" y="426" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">(empty = vars.ESIGNET_DB_PORT, else 5432)</text>
<rect x="46" y="434" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="453" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">esignet_db_port</text>
<circle cx="27" cy="486" r="10" fill="#0969da"/>
<text x="27" y="490" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">6</text>
<text x="46" y="490" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Keycloak database: bundled or external (shared PostgreSQL).</text>
<text x="46" y="506" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Empty = keep vars.KEYCLOAK_DB; unset = bundled</text>
<rect x="46" y="514" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="533" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">keycloak_db</text>
<circle cx="27" cy="566" r="10" fill="#0969da"/>
<text x="27" y="570" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">7</text>
<text x="46" y="570" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Monitoring/logging stack (prereq DSF): standalone = Loki +</text>
<text x="46" y="586" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Grafana + kube-prometheus-stack, Alertmanager email (default) |</text>
<text x="46" y="602" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">rancher = ELK + rancher-monitoring, Slack. Empty =</text>
<text x="46" y="618" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">vars.MONITORING_STACK, else standalone</text>
<rect x="46" y="626" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="645" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">monitoring_stack</text>
<circle cx="27" cy="678" r="10" fill="#0969da"/>
<text x="27" y="682" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">8</text>
<text x="46" y="682" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Environment name (e.g. sandbox, dev, staging)</text>
<rect x="46" y="690" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="709" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">env_name</text>
<circle cx="27" cy="742" r="10" fill="#0969da"/>
<text x="27" y="746" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">9</text>
<text x="46" y="746" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Organization mail id(s) for cluster alert notifications, comma-</text>
<text x="46" y="762" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">separated (e.g. xyz@gmail.com, abc@gmail.com). Needed for</text>
<text x="46" y="778" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">monitoring_stack=standalone (default); empty =</text>
<text x="46" y="794" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">vars.ALERT_RECIPIENTS</text>
<rect x="46" y="802" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="821" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">alert_recipients</text>
<circle cx="27" cy="854" r="10" fill="#0969da"/>
<text x="27" y="858" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">10</text>
<text x="46" y="858" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Alertmanager sender address (monitoring_stack=standalone), e.g.</text>
<text x="46" y="874" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">alerts@example.org; empty = vars.SMTP_FROM (legacy</text>
<text x="46" y="890" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">vars.MAIL_ID). Password: secrets.SMTP_PASSWORD</text>
<rect x="46" y="898" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="917" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">smtp_from</text>
<circle cx="27" cy="950" r="10" fill="#0969da"/>
<text x="27" y="954" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">11</text>
<text x="46" y="954" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Alertmanager SMTP server host:port</text>
<text x="46" y="970" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">(monitoring_stack=standalone); empty = vars.SMTP_HOST, else</text>
<text x="46" y="986" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">smtp.gmail.com:587</text>
<rect x="46" y="994" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="1013" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">smtp_host</text>
<circle cx="27" cy="1046" r="10" fill="#0969da"/>
<text x="27" y="1050" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">12</text>
<text x="46" y="1050" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Alertmanager SMTP login (monitoring_stack=standalone); empty =</text>
<text x="46" y="1066" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">vars.SMTP_USERNAME, else the sender address</text>
<rect x="46" y="1074" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="1093" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">smtp_username</text>
<circle cx="27" cy="1126" r="10" fill="#0969da"/>
<text x="27" y="1130" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">13</text>
<text x="46" y="1130" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Optional, monitoring_stack=rancher only: Slack channel for</text>
<text x="46" y="1146" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">alerting (e.g. #mosip-alerts); empty = vars.SLACK_CHANNEL_NAME</text>
<rect x="46" y="1154" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="1173" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">slack_channel_name</text>
<circle cx="27" cy="1206" r="10" fill="#0969da"/>
<text x="27" y="1210" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">14</text>
<text x="46" y="1210" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Optional, monitoring_stack=rancher only: Slack webhook URL</text>
<text x="46" y="1226" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">(prefer secrets.SLACK_WEBHOOK_URL); masked in logs</text>
<rect x="46" y="1234" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="1253" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">slack_webhook_url</text>
<circle cx="27" cy="1286" r="10" fill="#0969da"/>
<text x="27" y="1290" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">15</text>
<text x="46" y="1290" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Rancher cluster ID (e.g. c-xxxxx): required only for</text>
<text x="46" y="1306" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">monitoring_stack=rancher; empty = vars.CLUSTER_ID</text>
<rect x="46" y="1314" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="1333" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">clusterid</text>
<circle cx="27" cy="1366" r="10" fill="#0969da"/>
<text x="27" y="1370" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">16</text>
<text x="46" y="1370" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Optional recovery: app name (e.g. kube-prometheus-stack) to</text>
<text x="46" y="1386" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">force-upgrade so its pre/postUpgrade hooks run again (helmsman</text>
<text x="46" y="1402" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">--always-upgrade --target). Empty = normal run</text>
<rect x="46" y="1410" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="1429" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">rerun_hooks_for</text>
<rect x="16" y="1456" width="120" height="30" rx="6" fill="#1f883d"/>
<text x="76" y="1475" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Run workflow</text>
<text x="230.0" y="1519" font-size="10" font-weight="normal" fill="#59636e" text-anchor="middle">Generated from .github/workflows/helmsman_external.yml</text>
</svg>
