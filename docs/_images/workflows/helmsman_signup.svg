<svg xmlns="http://www.w3.org/2000/svg" width="460" height="532" viewBox="0 0 460 532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Deploy Signup services using Helmsman — Run workflow form">
<title>Deploy Signup services using Helmsman — Run workflow form</title>
<rect x="0.5" y="0.5" width="459" height="505" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="16" y="30" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Run workflow</text>
<text x="16" y="58" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">Use workflow from</text>
<rect x="16" y="66" width="190" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="26" y="85" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Branch: &lt;your branch&gt; ▾</text>
<circle cx="27" cy="122" r="10" fill="#0969da"/>
<text x="27" y="126" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<text x="46" y="126" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Deployment profile to use<tspan fill="#d1242f" font-weight="600"> *</tspan></text>
<rect x="46" y="134" width="398" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="56" y="153" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">esignet-standalone</text>
<text x="434" y="153" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="end">▾</text>
<text x="420" y="153" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">profile</text>
<text x="46" y="177" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">other options: esignet-standalone-2.0.0 | mosip-platform-1.2.0.x | …</text>
<circle cx="27" cy="200" r="10" fill="#0969da"/>
<text x="27" y="204" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="46" y="204" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Choose Helmsman mode: dry-run or apply<tspan fill="#d1242f" font-weight="600"> *</tspan></text>
<rect x="46" y="212" width="398" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="56" y="231" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">dry-run</text>
<text x="434" y="231" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="end">▾</text>
<text x="420" y="231" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">mode</text>
<text x="46" y="255" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">other options: apply</text>
<circle cx="27" cy="278" r="10" fill="#0969da"/>
<text x="27" y="282" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<rect x="46" y="270" width="14" height="14" rx="3" fill="#ffffff" stroke="#59636e"/>
<text x="68" y="282" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Delete existing signup/kernel jobs before deployment</text>
<text x="68" y="298" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">(required for re-runs)</text>
<text x="68" y="312" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">delete_existing_jobs</text>
<circle cx="27" cy="338" r="10" fill="#0969da"/>
<text x="27" y="342" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
<text x="46" y="342" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Domain name for this environment (e.g. example.xyz.net)<tspan fill="#d1242f" font-weight="600"> *</tspan></text>
<rect x="46" y="350" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="369" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">domain_name</text>
<circle cx="27" cy="402" r="10" fill="#0969da"/>
<text x="27" y="406" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
<text x="46" y="406" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Environment name (e.g. sandbox, dev, staging)</text>
<rect x="46" y="414" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="433" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">env_name</text>
<rect x="16" y="460" width="120" height="30" rx="6" fill="#1f883d"/>
<text x="76" y="479" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Run workflow</text>
<text x="230.0" y="523" font-size="10" font-weight="normal" fill="#59636e" text-anchor="middle">Generated from .github/workflows/helmsman_signup.yml</text>
</svg>
