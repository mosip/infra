<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1258" viewBox="0 0 460 1258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="terraform plan / apply — Run workflow form">
<title>terraform plan / apply — Run workflow form</title>
<rect x="0.5" y="0.5" width="459" height="1231" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="16" y="30" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Run workflow</text>
<text x="16" y="58" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">Use workflow from</text>
<rect x="16" y="66" width="190" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="26" y="85" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Branch: &lt;your branch&gt; ▾</text>
<circle cx="27" cy="122" r="10" fill="#0969da"/>
<text x="27" y="126" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<text x="46" y="126" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Cloud provider (azure/gcp: base-infra only)<tspan fill="#d1242f" font-weight="600"> *</tspan></text>
<rect x="46" y="134" width="398" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="56" y="153" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">aws</text>
<text x="434" y="153" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="end">▾</text>
<text x="420" y="153" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">CLOUD_PROVIDER</text>
<text x="46" y="177" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">other options: azure | gcp</text>
<circle cx="27" cy="200" r="10" fill="#0969da"/>
<text x="27" y="204" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="46" y="204" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">What to run. all = every component in order, then configure. vm</text>
<text x="46" y="220" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">= standalone EC2+SG+IAM. base-infra = one-time VPC/WireGuard.<tspan fill="#d1242f" font-weight="600"> *</tspan></text>
<rect x="46" y="228" width="398" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="56" y="247" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">all</text>
<text x="434" y="247" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="end">▾</text>
<text x="420" y="247" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">COMPONENT</text>
<text x="46" y="271" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">other options: security | iam | compute | storage | dns | configure…</text>
<circle cx="27" cy="294" r="10" fill="#0969da"/>
<text x="27" y="298" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<text x="46" y="298" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Deployment shape (profiles/&lt;name&gt;) — ignored for base-infra<tspan fill="#d1242f" font-weight="600"> *</tspan></text>
<rect x="46" y="306" width="398" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="56" y="325" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">mosip</text>
<text x="434" y="325" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="end">▾</text>
<text x="420" y="325" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">PROFILE</text>
<text x="46" y="349" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">other options: esignet-standalone | observ</text>
<circle cx="27" cy="372" r="10" fill="#0969da"/>
<text x="27" y="376" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
<text x="46" y="376" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Terraform backend type<tspan fill="#d1242f" font-weight="600"> *</tspan></text>
<rect x="46" y="384" width="398" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="56" y="403" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">local</text>
<text x="434" y="403" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="end">▾</text>
<text x="420" y="403" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">BACKEND_TYPE</text>
<text x="46" y="427" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">other options: remote</text>
<circle cx="27" cy="450" r="10" fill="#0969da"/>
<text x="27" y="454" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
<text x="46" y="454" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Remote backend config (aws:bucket_base_name:region |</text>
<text x="46" y="470" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">azure:rg:storage_account:container | gcp:bucket)</text>
<rect x="46" y="478" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="497" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">REMOTE_BACKEND_CONFIG</text>
<circle cx="27" cy="530" r="10" fill="#0969da"/>
<text x="27" y="534" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">6</text>
<rect x="46" y="522" width="14" height="14" rx="3" fill="#ffffff" stroke="#59636e"/>
<text x="68" y="534" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Enable state locking (recommended for remote backends)</text>
<text x="68" y="548" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">ENABLE_STATE_LOCKING</text>
<circle cx="27" cy="574" r="10" fill="#0969da"/>
<text x="27" y="578" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">7</text>
<text x="46" y="578" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Name of the GitHub secret holding the SSH private key for the</text>
<text x="46" y="594" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">nodes<tspan fill="#d1242f" font-weight="600"> *</tspan></text>
<rect x="46" y="602" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="621" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">SSH_PRIVATE_KEY</text>
<circle cx="27" cy="654" r="10" fill="#0969da"/>
<text x="27" y="658" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">8</text>
<rect x="46" y="646" width="14" height="14" rx="3" fill="#ffffff" stroke="#59636e"/>
<text x="68" y="658" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Apply (unchecked = plan only). Required for all/configure.</text>
<text x="68" y="672" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">TERRAFORM_APPLY</text>
<circle cx="27" cy="698" r="10" fill="#0969da"/>
<text x="27" y="702" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">9</text>
<rect x="46" y="690" width="14" height="14" rx="3" fill="#ffffff" stroke="#59636e"/>
<text x="68" y="702" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Register the cluster in Rancher via API (RANCHER_API_URL +</text>
<text x="68" y="718" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">RANCHER_API_TOKEN secrets)</text>
<text x="68" y="732" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">ENABLE_RANCHER_IMPORT</text>
<circle cx="27" cy="758" r="10" fill="#0969da"/>
<text x="27" y="762" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">10</text>
<text x="46" y="762" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Rancher cluster name (defaults to branch/env name)</text>
<rect x="46" y="770" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="789" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">RANCHER_CLUSTER_NAME</text>
<circle cx="27" cy="822" r="10" fill="#0969da"/>
<text x="27" y="826" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">11</text>
<rect x="46" y="814" width="14" height="14" rx="3" fill="#0969da" stroke="#0969da"/>
<path d="M49 821 l3 3 l5 -6" stroke="#ffffff" stroke-width="2" fill="none"/>
<text x="68" y="826" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">After import, fetch kubeconfig from Rancher and set the</text>
<text x="68" y="842" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">KUBECONFIG env secret</text>
<text x="68" y="856" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">PUBLISH_KUBECONFIG</text>
<circle cx="27" cy="882" r="10" fill="#0969da"/>
<text x="27" y="886" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">12</text>
<rect x="46" y="874" width="14" height="14" rx="3" fill="#ffffff" stroke="#59636e"/>
<text x="68" y="886" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Also grant other teams from rancher-access-grants.json.</text>
<text x="68" y="902" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">DEVOPS cluster-owner is always applied.</text>
<text x="68" y="916" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">GRANT_GROUP_ACCESS</text>
<circle cx="27" cy="942" r="10" fill="#0969da"/>
<text x="27" y="946" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">13</text>
<rect x="46" y="934" width="14" height="14" rx="3" fill="#ffffff" stroke="#59636e"/>
<text x="68" y="946" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Grant an additional group cluster-owner access (DEVOPS stays</text>
<text x="68" y="962" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">cluster-owner too)</text>
<text x="68" y="976" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">RANCHER_CLUSTER_OWNER_GROUP_ENABLED</text>
<circle cx="27" cy="1002" r="10" fill="#0969da"/>
<text x="27" y="1006" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">14</text>
<text x="46" y="1006" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Group name for cluster-owner override (e.g. QA)</text>
<rect x="46" y="1014" width="398" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="434" y="1033" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">RANCHER_CLUSTER_OWNER_GROUP</text>
<circle cx="27" cy="1066" r="10" fill="#0969da"/>
<text x="27" y="1070" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">15</text>
<text x="46" y="1070" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Who creates DNS records. terraform-route53 = Terraform dns</text>
<text x="46" y="1086" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">component; godaddy/cloudflare/rfc2136 = Ansible dns role</text>
<text x="46" y="1102" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">(provider secrets); manual = no DNS yet (no TLS/nginx</text>
<text x="46" y="1118" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">proxy/Rancher import, records printed)</text>
<rect x="46" y="1126" width="398" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="56" y="1145" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">terraform-route53</text>
<text x="434" y="1145" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="end">▾</text>
<text x="420" y="1145" font-size="10" font-weight="normal" fill="#59636e" text-anchor="end">DNS_PROVIDER</text>
<text x="46" y="1169" font-size="10" font-weight="normal" fill="#59636e" text-anchor="start">other options: godaddy | cloudflare | rfc2136 | manual</text>
<rect x="16" y="1186" width="120" height="30" rx="6" fill="#1f883d"/>
<text x="76" y="1205" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Run workflow</text>
<text x="230.0" y="1249" font-size="10" font-weight="normal" fill="#59636e" text-anchor="middle">Generated from .github/workflows/terraform.yml</text>
</svg>
