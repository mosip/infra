      extraEnvVars.KEYMANAGER_PKCS11_PIN.valueFrom.secretKeyRef.name: "esignet-softhsm-mosipid"
      extraEnvVars.KEYMANAGER_PKCS11_PIN.valueFrom.secretKeyRef.key: "security-pin"
      extraEnvVars.MOSIP_IDA_CLIENT_SECRET.valueFrom.secretKeyRef.name: "keycloak-client-secrets-mosipid"
      extraEnvVars.MOSIP_IDA_CLIENT_SECRET.valueFrom.secretKeyRef.key: "mosip_ida_client_secret"
      extraEnvVars.MOSIP_ESIGNET_AUTHN_PROVIDER: "mosip"
      extraEnvVars.NAMESPACE: "mosipid"
      extraEnvVars.MOSIP_ESIGNET_CAPTCHA_SITE_PROVIDER: "google-recaptcha"
      extraEnvVars.MOSIP_ESIGNET_CAPTCHA_VALIDATOR_URL: "http://captcha.captcha/v1/captcha/validatecaptcha"
      extraEnvVarsAdditional.hsm_client_zip_url_env: "https://raw.githubusercontent.com/mosip/artifactory-ref-impl/master/artifacts/src/hsm/client.zip"
      extraEnvVars.OIDC_UI_SCHEME: "https"
      extraEnvVars.OIDC_UI_PORT: "443"
      extraEnvVars.OIDC_UI_LOGIN_PATH: "/signin"
      extraEnvVars.OIDC_UI_ERROR_PATH: "/error"
      extraEnvVars.DEFAULT_THEME_ID: "decl-theme-1"
      extraEnvVars.DEFAULT_LAYOUT_ID: "decl-layout-1"
      extraEnvVars.DEFAULT_AUTH_FLOW_ID: "decl-mosip-otp-flow-1"
      extraEnvVarsAdditional.MOSIP_ESIGNET_CAPTCHA_MODULE_NAME: "esignetmosipid"
      extraEnvVarsAdditional.MOSIP_ESIGNET_CAPTCHA_SITE_KEY.valueFrom.secretKeyRef.name: "esignet-captcha-mosipid"
      extraEnvVarsAdditional.MOSIP_ESIGNET_CAPTCHA_SITE_KEY.valueFrom.secretKeyRef.key: "esignet-captcha-site-key"
      extraEnvVarsAdditional.plugin_name_env: "mosip-identity-plugin.jar"
      extraEnvVarsAdditional.SPRING_KAFKA_CONSUMER_GROUP_ID: "esignet-consumer-esignet-mosipid"
      extraEnvVarsAdditional.MOSIP_ESIGNET_SIGNUP_ID_TOKEN_AUDIENCE: "esignet-mosipid-signup-esqa020"
