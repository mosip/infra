      domainConfig.MOSIP_ESIGNET_AUTHENTICATOR_IDA_AUTH_TOKEN_URL: "https://api-internal.${mosipid_domain_name}/v1/authmanager/authenticate/clientidsecretkey"
      domainConfig.MOSIP_ESIGNET_AUTHENTICATOR_IDA_AUDIT_MANAGER_URL: "https://api-internal.${mosipid_domain_name}/v1/auditmanager/audits"
      domainConfig.MOSIP_ESIGNET_IDA_AUTH_DOMAIN: "https://api-internal.${mosipid_domain_name}"
      domainConfig.MOSIP_ESIGNET_AUTHENTICATOR_IDA_DOMAINURI: "https://esignet-mosipid.${domain_name}"
      domainConfig.MOSIP_ESIGNET_DOMAIN_URL: "https://esignet-mosipid.${domain_name}"
      domainConfig.OIDC_UI_HOSTNAME: "esignet-mosipid.${domain_name}"
      domainConfig.MOSIP_ESIGNET_HOST: "https://esignet-mosipid.${domain_name}"
      domainConfig.MOSIP_SIGNUP_HOST: "https://signup-mosipid.${domain_name}"
      domainConfig.MOSIP_API_INTERNAL_HOST: "https://api-internal.${mosipid_domain_name}"
      # Chart-default extraEnvVars.MOSIP_ESIGNET_HOST/MOSIP_SIGNUP_HOST/MOSIP_API_INTERNAL_HOST
      # are tables (valueFrom.configMapKeyRef against esignet-global). A plain string override
      # at the same key produces a "cannot overwrite table with non table" coalesce warning
      # (harmless on its own, but noisy) and still leaves domainConfig's own same-named entry
      # as a genuinely separate list item - so null the chart-default keys out entirely
      # instead, letting domainConfig (above) be the sole source, matching the pattern used
      # for KEYMANAGER_PKCS11_* elsewhere in this file. "null" (quoted) is required: Helmsman's
      # YAML parsing turns a bare `null` into an empty string, not the literal text Helm needs
      # to delete a key.
      extraEnvVars.MOSIP_ESIGNET_HOST: "null"
      extraEnvVars.MOSIP_SIGNUP_HOST: "null"
      extraEnvVars.MOSIP_API_INTERNAL_HOST: "null"
      extraEnvVars.KEYCLOAK_EXTERNAL_URL.valueFrom.configMapKeyRef.name: "keycloak-host"
      extraEnvVars.KEYCLOAK_EXTERNAL_URL.valueFrom.configMapKeyRef.key: "keycloak-external-url"
      extraEnvVars.REDIS_HOST.valueFrom.configMapKeyRef.name: "redis-config"
      extraEnvVars.REDIS_HOST.valueFrom.configMapKeyRef.key: "redis-host"
      extraEnvVars.REDIS_PORT.valueFrom.configMapKeyRef.name: "redis-config"
      extraEnvVars.REDIS_PORT.valueFrom.configMapKeyRef.key: "redis-port"
      extraEnvVars.REDIS_PASSWORD.valueFrom.secretKeyRef.name: "redis"
      extraEnvVars.REDIS_PASSWORD.valueFrom.secretKeyRef.key: "redis-password"
      extraEnvVars.DATABASE_HOST.valueFrom.configMapKeyRef.name: "postgres-config"
      extraEnvVars.DATABASE_HOST.valueFrom.configMapKeyRef.key: "database-host"
      extraEnvVars.DATABASE_PORT.valueFrom.configMapKeyRef.name: "postgres-config"
      extraEnvVars.DATABASE_PORT.valueFrom.configMapKeyRef.key: "database-port"
      extraEnvVars.DATABASE_NAME.valueFrom.configMapKeyRef.name: "postgres-config"
      extraEnvVars.DATABASE_NAME.valueFrom.configMapKeyRef.key: "database-name"
      extraEnvVars.DATABASE_USERNAME.valueFrom.configMapKeyRef.name: "postgres-config"
      extraEnvVars.DATABASE_USERNAME.valueFrom.configMapKeyRef.key: "database-username"
      extraEnvVars.DB_DBUSER_PASSWORD.valueFrom.secretKeyRef.name: "db-common-secrets"
      extraEnvVars.DB_DBUSER_PASSWORD.valueFrom.secretKeyRef.key: "db-dbuser-password"
      extraEnvVars.SOFTHSM_ESIGNET_SECURITY_PIN.valueFrom.secretKeyRef.name: "esignet-softhsm-mosipid"
      extraEnvVars.SOFTHSM_ESIGNET_SECURITY_PIN.valueFrom.secretKeyRef.key: "security-pin"
      # Chart-default extraEnvVars.KEYMANAGER_PKCS11_PIN points at a plain "esignet-softhsm"
      # secret that doesn't exist in this namespace (only esignet-softhsm-mosipid does) -
      # override directly under extraEnvVars (not extraEnvVarsAdditional) so the chart's
      # own defaults for these same keys don't also coexist redundantly in the rendered env.
      extraEnvVars.KEYMANAGER_DB_SCHEMA: "esignet"
      extraEnvVars.KEYMANAGER_KEYSTORE_TYPE: "PKCS11"
      extraEnvVars.KEYMANAGER_PKCS11_MODULE_PATH: "/usr/local/lib/softhsm/libpkcs11-proxy.so"
