# =============================================================================
# eSignet Profile - eSignet Services DSF (Desired State File)
# =============================================================================
# This DSF deploys eSignet 2.0.0 (Go) services for the standalone eSignet profile.
#
# Components (in priority order):
#   1. Keycloak Init (eSignet-specific clients and roles)
#   2. eSignet service 2.0.0-develop (Go)
#   3. OIDC UI 2.0.0-develop (Go)
#   4. Mock Identity System (optional, disabled by default)
#   5. Mock Relying Party Service (optional)
#   6. Mock Relying Party UI (optional)
#   7. Partner Onboarder (eSignet + Resident OIDC)
#   8. Demo OIDC Partner Onboarder
#
# Based on eSignet 2.0.0 deploy scripts:
#   - install-esignet.sh
#   - initialise-prereq.sh (keycloak-init)
# =============================================================================

helmDefaults:
  tillerNamespace: kube-system
  tillerless: true
  install: true

helmRepos:
  bitnami: https://charts.bitnami.com/bitnami
  mosip: https://mosip.github.io/mosip-helm

namespaces:
  esignet-mock:
    protected: false
  softhsm:
    protected: false
  esignet-mosipid:
    protected: false
  esignet-sunbird:
    protected: false           

apps:
  # ---------------------------------------------------------------------------
  # SoftHSM for eSignet
  # ---------------------------------------------------------------------------
  # Deployed here (not in external-dsf) so esignet-softhsm-share configmap is
  # available in esignet namespace before eSignet service starts.
  esignet-softhsm:
    namespace: esignet-mock
    enabled: true
    version: 12.0.1
    chart: mosip/softhsm
    valuesFile: "$WORKDIR/utils/softhsm-esignet-values.yaml"
    timeout: 480
    priority: -16
    hooks:
      preInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/softhsm-esignet-setup.sh"

  esignet-softhsm-mosipid:
    namespace: esignet-mosipid
    enabled: true
    version: 12.0.1
    chart: mosip/softhsm
    valuesFile: "$WORKDIR/utils/softhsm-esignet-mosipid-values.yaml"
    timeout: 480
    priority: -16
    hooks:
      preInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/softhsm-esignet-mosipid-setup.sh"

  esignet-softhsm-sunbird:
    namespace: esignet-sunbird
    enabled: true
    version: 12.0.1
    chart: mosip/softhsm
    valuesFile: "$WORKDIR/utils/softhsm-esignet-sunbird-values.yaml"
    timeout: 480
    priority: -16
    hooks:
      preInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/softhsm-esignet-sunbird-setup.sh"

  # ---------------------------------------------------------------------------
  # eSignet 
  # ---------------------------------------------------------------------------
  esignet-mock:
    namespace: esignet-mock
    enabled: true
    version: 2.0.0-develop
    chart: mosip/esignet
    set:
      image.repository: "mosipdev/esignet"
      image.tag: "develop-go"
      enable_insecure: "false"
      springConfigNameEnv: ""
      activeProfileEnv: ""
      pluginNameEnv: "esignet-mock-plugin.jar"
      pluginUrlEnv: ""
      extraEnvVarsCM[0]: "esignet-softhsm-share"
      #extraEnvVarsCM[1]: "kafka-config"
      metrics.serviceMonitor.enabled: "false"
      domainConfig.MOSIP_API_HOST: "https://api.${domain_name}"
      domainConfig.MOSIP_IAM_EXTERNAL_HOST: "https://iam.${domain_name}"
      domainConfig.MOSIP_KAFKA_HOST: "kafka.${domain_name}"
      domainConfig.MOSIP_POSTGRES_HOST: "postgres.${domain_name}"
      domainConfig.MOSIP_SMTP_HOST: "smtp.${domain_name}"
      domainConfig.installation-domain: "${domain_name}"
      domainConfig.OIDC_UI_HOSTNAME: "esignet.${domain_name}"
      domainConfig.MOSIP_API_INTERNAL_HOST: "https://api-internal.${domain_name}"
      domainConfig.MOSIP_ESIGNET_HOST: "https://esignet.${domain_name}"
      domainConfig.MOSIP_SIGNUP_HOST: "https://signup.${domain_name}"
      # esignet-mock has no esignet-global configmap (only the mosipid/sunbird preinstall
      # hooks create their own per-namespace esignet-global) - these chart-default extraEnvVars
      # entries are tables (valueFrom.configMapKeyRef against esignet-global), so a plain
      # string override at the same key produces a "cannot overwrite table with non table"
      # coalesce warning (harmless on its own, but risks masking real errors in Helmsman's
      # truncated output) and would still fail with CreateContainerConfigError if left as the
      # chart default. Null them out entirely instead - MOSIP_API_INTERNAL_HOST/MOSIP_ESIGNET_HOST/
      # MOSIP_SIGNUP_HOST now come from domainConfig (above); MOSIP_ESIGNET_OIDC_UI_HOSTNAME has
      # no domainConfig equivalent key so it's set via extraEnvVarsAdditional instead (renders
      # after extraEnvVars, no chart-default table to conflict with). "null" (quoted) is
      # required: Helmsman's YAML parsing turns a bare `null` into an empty string, not the
      # literal text Helm needs to delete a key.
      extraEnvVars.MOSIP_API_INTERNAL_HOST: "null"
      extraEnvVars.MOSIP_ESIGNET_OIDC_UI_HOSTNAME: "null"
      extraEnvVars.MOSIP_ESIGNET_HOST: "null"
      extraEnvVars.MOSIP_SIGNUP_HOST: "null"
      extraEnvVarsAdditional.MOSIP_ESIGNET_OIDC_UI_HOSTNAME: "esignet.${domain_name}"
      extraEnvVars.KEYCLOAK_EXTERNAL_URL.valueFrom.configMapKeyRef.name: "keycloak-host"
      extraEnvVars.KEYCLOAK_EXTERNAL_URL.valueFrom.configMapKeyRef.key: "keycloak-external-url"
      extraEnvVars.MOSIP_ESIGNET_CAPTCHA_SITE_KEY.valueFrom.secretKeyRef.name: "esignet-captcha"
      extraEnvVars.MOSIP_ESIGNET_CAPTCHA_SITE_KEY.valueFrom.secretKeyRef.key: "esignet-captcha-site-key"
      extraEnvVars.MOSIP_ESIGNET_CAPTCHA_MODULE_NAME: "esignet"
      extraEnvVars.MOSIP_ESIGNET_CAPTCHA_SITE_PROVIDER: "google-recaptcha"
      extraEnvVars.MOSIP_ESIGNET_CAPTCHA_VALIDATOR_URL: "http://captcha.captcha/v1/captcha/validatecaptcha"
      extraEnvVars.REDIS_HOST.valueFrom.configMapKeyRef.name: "redis-config"
      extraEnvVars.REDIS_HOST.valueFrom.configMapKeyRef.key: "redis-host"
      extraEnvVars.REDIS_PORT.valueFrom.configMapKeyRef.name: "redis-config"
      extraEnvVars.REDIS_PORT.valueFrom.configMapKeyRef.key: "redis-port"
      extraEnvVars.REDIS_PASSWORD.valueFrom.secretKeyRef.name: "redis"
      extraEnvVars.REDIS_PASSWORD.valueFrom.secretKeyRef.key: "redis-password"
      extraEnvVars.DATABASE_HOST.valueFrom.configMapKeyRef.name: "postgres-config"
      extraEnvVars.DATABASE_HOST.valueFrom.configMapKeyRef.key: "database-host"
      extraEnvVars.DATABASE_PORT.valueFrom.configMapKeyRef.name: "postgres-config"
      extraEnvVars.DATABASE_PORT.valueFrom.configMapKeyRef.key: "database-port"
      extraEnvVars.DATABASE_NAME.valueFrom.configMapKeyRef.name: "postgres-config"
      extraEnvVars.DATABASE_NAME.valueFrom.configMapKeyRef.key: "database-name"
      extraEnvVars.DATABASE_USERNAME.valueFrom.configMapKeyRef.name: "postgres-config"
      extraEnvVars.DATABASE_USERNAME.valueFrom.configMapKeyRef.key: "database-username"
      extraEnvVars.DB_DBUSER_PASSWORD.valueFrom.secretKeyRef.name: "db-common-secrets"
      extraEnvVars.DB_DBUSER_PASSWORD.valueFrom.secretKeyRef.key: "db-dbuser-password"
      extraEnvVars.SOFTHSM_ESIGNET_SECURITY_PIN.valueFrom.secretKeyRef.name: "esignet-softhsm"
      extraEnvVars.SOFTHSM_ESIGNET_SECURITY_PIN.valueFrom.secretKeyRef.key: "security-pin"
      extraEnvVars.MOSIP_IDA_CLIENT_SECRET.valueFrom.secretKeyRef.name: "keycloak-client-secrets"
      extraEnvVars.MOSIP_IDA_CLIENT_SECRET.valueFrom.secretKeyRef.key: "mosip_ida_client_secret"
      extraEnvVars.MOSIP_ESIGNET_AUTHN_PROVIDER: "mock"
      extraEnvVars.NAMESPACE: "mock"
      extraEnvVars.KEYMANAGER_DB_SCHEMA: "esignet"
      persistence.enabled: "true"
      persistence.pvc_claim_name: "esignet-mock-pkcs12-keystore"
      extraEnvVars.OIDC_UI_SCHEME: "https"
      extraEnvVars.OIDC_UI_PORT: "443"
      extraEnvVars.OIDC_UI_LOGIN_PATH: "/signin"
      extraEnvVars.OIDC_UI_ERROR_PATH: "/error"
      extraEnvVars.DEFAULT_THEME_ID: "decl-theme-1"
      extraEnvVars.DEFAULT_LAYOUT_ID: "decl-layout-1"
      extraEnvVars.DEFAULT_AUTH_FLOW_ID: "decl-mosip-otp-flow-1"
      extraEnvVarsAdditional.MOSIP_ESIGNET_CAPTCHA_REQUIRED: ""
      # Overridden directly under extraEnvVars (not extraEnvVarsAdditional) so the
      # chart's own PKCS11 defaults for these same keys don't also render into the
      # env: list - relying on extraEnvVarsAdditional's last-wins ordering left the
      # redundant PKCS11 entries (module path, token label, slot id, PIN secretKeyRef)
      # coexisting alongside these, which happened to still work here (esignet-softhsm
      # secret exists in this namespace) but is fragile and confusing.
      extraEnvVars.KEYMANAGER_KEYSTORE_TYPE: "PKCS12"
      extraEnvVars.KEYMANAGER_PKCS12_FILE_PATH: "/home/mosip/config/keystore.p12"
      extraEnvVars.KEYMANAGER_PKCS12_PASSWORD: "localtest"
      extraEnvVars.KEYMANAGER_PKCS12_ALLOW_INSECURE_SOFTWARE_KEYSTORE: "true"
      extraEnvVars.KEYMANAGER_PKCS11_MODULE_PATH: ""
      extraEnvVars.KEYMANAGER_PKCS11_TOKEN_LABEL: ""
      extraEnvVars.KEYMANAGER_PKCS11_SLOT_ID: ""
      # KEYMANAGER_PKCS11_PIN's chart default is a table (valueFrom.secretKeyRef), unlike the
      # three plain-string defaults above - an empty-string override here still triggers the
      # coalesce "cannot overwrite table with non table" warning, so null it out instead.
      extraEnvVars.KEYMANAGER_PKCS11_PIN: "null"
    timeout: 600
    priority: -14
    hooks:
      preInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/esignet-preinstall.sh"
      postInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/captcha-postinstall.sh"

  esignet-mosipid:
    namespace: esignet-mosipid
    enabled: true
    version: 2.0.0-develop
    chart: mosip/esignet
    set:
