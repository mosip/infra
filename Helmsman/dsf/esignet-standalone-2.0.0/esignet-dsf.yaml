      domainConfig.MOSIP_ESIGNET_AUTHENTICATOR_SUNBIRD_RC_AUTH_FACTOR_KBI_REGISTRY_SEARCH_URL: "https://registry.${mosipid_domain_name}/api/v1/Insurance/search"
      domainConfig.MOSIP_ESIGNET_AUTHENTICATOR_SUNBIRD_RC_REGISTRY_GET_URL: "https://registry.${mosipid_domain_name}/api/v1/Insurance/"
      domainConfig.OIDC_UI_HOSTNAME: "esignet-sunbird.${domain_name}"
      domainConfig.MOSIP_ESIGNET_HOST: "https://esignet-sunbird.${domain_name}"
      domainConfig.MOSIP_SIGNUP_HOST: "https://signup-sunbird.${domain_name}"
      domainConfig.MOSIP_API_INTERNAL_HOST: "https://api-internal.${domain_name}"
