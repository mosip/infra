# =============================================================================
# eSignet Standalone 2.0.0 Profile - Testrigs DSF (Desired State File)
# =============================================================================
# eSignet's own apitestrig/uitestrig apps below deploy the dedicated Go/Java-harness
# charts mosip/esignet-apitestrig and mosip/esignet-uitestrig (v2.0.0) — NOT the
# generic mosip/apitestrig / mosip/uitestrig charts the esignet-standalone (1.0/Java)
# profile still uses. These charts are purpose-built for eSignet 2.0.0 (Go) and have
# a completely different values schema (no modules.*/configmaps.* — see each chart's
# own values.yaml via `helm show values mosip/esignet-apitestrig --version 2.0.0`).
#
# Modeled directly on eSignet's own reference deploy scripts:
#   https://github.com/mosip/esignet/blob/v2.0.0/deploy/esignet-apitestrig/install.sh
#   https://github.com/mosip/esignet/blob/v2.0.0/deploy/esignet-uitestrig/install.sh
# translated from "helm install with two interactive prompts + a gitignored
# values.secret.yaml" into this DSF's declarative set: blocks, with every value
# either derived from this profile's existing ${domain_name}/${mosipid_domain_name}
# conventions or sourced from a required GitHub Environment secret/variable (see
# docs/HELMSMAN_TESTRIGS_GUIDE.md).
#
# Only esignet-mosipid gets real test-identity/onboarding values (INDIVIDUAL_ID,
# OTP recipient, auth partner/policy ID, UIN/VID/etc.) — it's the only instance
# backed by a real IDA identity (config.mosip.json / the "mosip" plugin). esignet-mock
# (config.mock.json / "mock" plugin) and esignet-sunbird (config.sunbird.json /
# "sunbird" plugin) need none of that.
#
# Report storage: reports.persistence (PVC) is used instead of reports.s3 — the S3
# path needs a pre-existing bucket this repo has no established convention for yet.
# Switch to reports.s3.enabled once one exists (reuse the ${MINIO_ROOT_PASSWORD}
# pattern from esignet-signup-apitestrig/signup-uitestrig below).
# =============================================================================

helmDefaults:
  tillerNamespace: kube-system
  tillerless: true
  install: true

helmRepos:
  bitnami: https://charts.bitnami.com/bitnami
  mosip: https://mosip.github.io/mosip-helm

# eSignet's own apitestrig deploys into the same namespace as the eSignet instance it
# tests (matches install.sh's own NS=esignet pattern, scaled to this profile's 3
# instances). uitestrig gets its own namespace per instance, same as install.sh's
# NS=esignet-uitestrig (separate from esignet-apitestrig's namespace) and matching
# this DSF's existing signup-uitestrig precedent.
namespaces:
  esignet-mock:
    protected: false
  esignet-mosipid:
    protected: false
  esignet-sunbird:
    protected: false
  esignet-uitestrig:
    protected: false
  esignet-mosipid-uitestrig:
    protected: false
  esignet-sunbird-uitestrig:
    protected: false
  signup:
    protected: false
  signup-uitestrig:
    protected: false

apps:
  # ---------------------------------------------------------------------------
  # eSignet API Testrig (Go harness) — esignet-mock namespace
  # ---------------------------------------------------------------------------
  esignet-apitestrig:
    namespace: esignet-mock
    enabled: true
    version: 2.0.0
    chart: mosip/esignet-apitestrig
    set:
      apitestrig.configFile: /app/data/config/config.mock.json
      # No plan JSON files provisioned for this profile — see header comment.
      apitestrig.surfaces: "api,e2e"
      apitestrig.extraEnvVars.MOSIP_ESIGNET_BASE_URL: "https://esignet.${domain_name}/v1/esignet"
      apitestrig.extraEnvVars.KEYCLOAK_TOKEN_URL: "https://iam.${domain_name}/auth/realms/mosip/protocol/openid-connect/token"
      apitestrig.extraEnvVars.KEYCLOAK_CLIENT_ID: "mosip-pms-client"
      apitestrig.extraEnvVarsSecret.KEYCLOAK_CLIENT_SECRET: "${PMS_CLIENT_SECRET_VALUE}"
      reports.persistence.enabled: "true"
    timeout: 900
    priority: -8
    hooks:
      preInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/apitestrig-esignet-setup.sh"

  # ---------------------------------------------------------------------------
  # eSignet-MOSIPID API Testrig (Go harness) — esignet-mosipid namespace
  # Only instance with real test-identity/onboarding values — see header comment.
  # ---------------------------------------------------------------------------
  esignet-mosipid-apitestrig:
    namespace: esignet-mosipid
    enabled: true
    version: 2.0.0
    chart: mosip/esignet-apitestrig
    set:
      apitestrig.configFile: /app/data/config/config.mosip.json
      apitestrig.surfaces: "api,e2e"
      apitestrig.extraEnvVars.MOSIP_ESIGNET_BASE_URL: "https://esignet-mosipid.${domain_name}/v1/esignet"
      apitestrig.extraEnvVars.KEYCLOAK_TOKEN_URL: "https://iam.${domain_name}/auth/realms/mosip/protocol/openid-connect/token"
      apitestrig.extraEnvVars.KEYCLOAK_CLIENT_ID: "mosip-pms-client"
      apitestrig.extraEnvVars.ID_TYPE: "uin"
      apitestrig.extraEnvVars.OTP_WS_URL: "https://smtp.${domain_name}"
      apitestrig.extraEnvVars.OTP_RECIPIENT_EMAIL: "${MOSIPID_TESTRIG_OTP_RECIPIENT}"
      apitestrig.extraEnvVars.PMS_BASE_URL: "https://api-internal.${mosipid_domain_name}/v1/partnermanager"
      apitestrig.extraEnvVars.AUTH_PARTNER_ID: "${MOSIPID_TESTRIG_AUTH_PARTNER_ID}"
      apitestrig.extraEnvVars.AUTH_POLICY_ID: "${MOSIPID_TESTRIG_AUTH_POLICY_ID}"
      apitestrig.extraEnvVarsSecret.KEYCLOAK_CLIENT_SECRET: "${PMS_CLIENT_SECRET_VALUE}"
      apitestrig.extraEnvVarsSecret.INDIVIDUAL_ID: "${MOSIPID_TESTRIG_INDIVIDUAL_ID}"
      reports.persistence.enabled: "true"
    timeout: 900
    priority: -7
    hooks:
      preInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/apitestrig-esignet-mosipid-setup.sh"

  # ---------------------------------------------------------------------------
  # eSignet-Sunbird API Testrig (Go harness) — esignet-sunbird namespace
  # ---------------------------------------------------------------------------
  esignet-sunbird-apitestrig:
    namespace: esignet-sunbird
    enabled: true
    version: 2.0.0
    chart: mosip/esignet-apitestrig
    set:
      apitestrig.configFile: /app/data/config/config.sunbird.json
      apitestrig.surfaces: "api,e2e"
      apitestrig.extraEnvVars.MOSIP_ESIGNET_BASE_URL: "https://esignet-sunbird.${domain_name}/v1/esignet"
      apitestrig.extraEnvVars.KEYCLOAK_TOKEN_URL: "https://iam.${domain_name}/auth/realms/mosip/protocol/openid-connect/token"
      apitestrig.extraEnvVars.KEYCLOAK_CLIENT_ID: "mosip-pms-client"
      apitestrig.extraEnvVarsSecret.KEYCLOAK_CLIENT_SECRET: "${PMS_CLIENT_SECRET_VALUE}"
      reports.persistence.enabled: "true"
    timeout: 900
    priority: -6
    hooks:
      preInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/apitestrig-esignet-sunbird-setup.sh"

  # ---------------------------------------------------------------------------
  # eSignet UI Testrig (Java harness, uitest-esignet image) — own namespace
  # ---------------------------------------------------------------------------
  esignet-uitestrig:
    namespace: esignet-uitestrig
    enabled: true
    version: 2.0.0
    chart: mosip/esignet-uitestrig
    set:
      uitestrig.extraEnvVars.ENV_ENDPOINT: "https://api-internal.${domain_name}"
      uitestrig.extraEnvVars.ENV_USER: "api-internal.${env_name}"
      uitestrig.configMap.baseurl: "https://healthservices.${domain_name}/"
      uitestrig.configMap.eSignetbaseurl: "https://esignet.${domain_name}"
      uitestrig.configMap.pluginToExecute: "mock"
      uitestrig.configMap.esignetDbHost: "postgres-postgresql.postgres"
      uitestrig.configMap.esignetDbPort: "${esignet_db_port}"
      uitestrig.secret.esignetDbPassword: "${DB_USER_PASSWORD}"
      uitestrig.secret.keycloak_Password: "${MOSIPID_KEYCLOAK_ADMIN_PASSWORD}"
      uitestrig.secret.mosip_testrig_client_secret: "${ESIGNET_UITESTRIG_CLIENT_SECRET}"
      uitestrig.secret.oidcClientId: "${ESIGNET_UITESTRIG_OIDC_CLIENT_ID}"
      reports.persistence.enabled: "true"
    timeout: 1800
    priority: -5
    hooks:
      preInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/uitestrig-esignet-setup.sh"

  # ---------------------------------------------------------------------------
  # eSignet-MOSIPID UI Testrig — own namespace
  # Only instance with real test-identity values — see header comment.
  # ---------------------------------------------------------------------------
  esignet-mosipid-uitestrig:
    namespace: esignet-mosipid-uitestrig
    enabled: true
    version: 2.0.0
    chart: mosip/esignet-uitestrig
    set:
      uitestrig.extraEnvVars.ENV_ENDPOINT: "https://api-internal.${mosipid_domain_name}"
      uitestrig.extraEnvVars.ENV_USER: "api-internal.${env_name}"
      uitestrig.configMap.baseurl: "https://healthservices-mosipid.${domain_name}/"
      uitestrig.configMap.eSignetbaseurl: "https://esignet-mosipid.${domain_name}"
      uitestrig.configMap.pluginToExecute: "mosip"
      uitestrig.configMap.esignetDbHost: "postgres-postgresql.postgres"
      uitestrig.configMap.esignetDbPort: "${esignet_db_port}"
      uitestrig.secret.esignetDbPassword: "${DB_USER_PASSWORD}"
      uitestrig.secret.keycloak_Password: "${MOSIPID_KEYCLOAK_ADMIN_PASSWORD}"
      uitestrig.secret.mosip_testrig_client_secret: "${ESIGNET_UITESTRIG_CLIENT_SECRET}"
      uitestrig.secret.oidcClientId: "${ESIGNET_UITESTRIG_OIDC_CLIENT_ID}"
      uitestrig.secret.uin: "${MOSIPID_TESTRIG_UIN}"
      uitestrig.secret.vid: "${MOSIPID_TESTRIG_VID}"
      uitestrig.secret.uinPhoneNumber: "${MOSIPID_TESTRIG_PHONE_NUMBER}"
      uitestrig.secret.emailLoginId: "${MOSIPID_TESTRIG_EMAIL_LOGIN_ID}"
      uitestrig.secret.passwordLoginUin: "${MOSIPID_TESTRIG_PASSWORD_LOGIN_UIN}"
      uitestrig.secret.passwordLoginPassword: "${MOSIPID_TESTRIG_PASSWORD_LOGIN_PASSWORD}"
      reports.persistence.enabled: "true"
    timeout: 1800
    priority: -4
    hooks:
      preInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/uitestrig-esignet-mosipid-setup.sh"

  # ---------------------------------------------------------------------------
  # eSignet-Sunbird UI Testrig — own namespace
  # ---------------------------------------------------------------------------
  esignet-sunbird-uitestrig:
    namespace: esignet-sunbird-uitestrig
    enabled: true
    version: 2.0.0
    chart: mosip/esignet-uitestrig
    set:
      uitestrig.extraEnvVars.ENV_ENDPOINT: "https://api-internal.${domain_name}"
      uitestrig.extraEnvVars.ENV_USER: "api-internal.${env_name}"
      uitestrig.configMap.baseurl: "https://healthservices-sunbird.${domain_name}/"
      uitestrig.configMap.eSignetbaseurl: "https://esignet-sunbird.${domain_name}"
      uitestrig.configMap.pluginToExecute: "sunbird"
      uitestrig.configMap.esignetDbHost: "postgres-postgresql.postgres"
      uitestrig.configMap.esignetDbPort: "${esignet_db_port}"
      uitestrig.secret.esignetDbPassword: "${DB_USER_PASSWORD}"
      uitestrig.secret.keycloak_Password: "${MOSIPID_KEYCLOAK_ADMIN_PASSWORD}"
      uitestrig.secret.mosip_testrig_client_secret: "${ESIGNET_UITESTRIG_CLIENT_SECRET}"
      uitestrig.secret.oidcClientId: "${ESIGNET_UITESTRIG_OIDC_CLIENT_ID}"
      reports.persistence.enabled: "true"
    timeout: 1800
    priority: -3
    hooks:
      preInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/uitestrig-esignet-sunbird-setup.sh"

  # ---------------------------------------------------------------------------
  # Signup API Test Rig — disabled by default
  # Enable only if signup stack (signup-dsf) is deployed. Still the generic
  # mosip/apitestrig chart — eSignet's own esignet-apitestrig deploy scripts don't
  # cover signup.
  # ---------------------------------------------------------------------------
  esignet-signup-apitestrig:
    namespace: signup
    enabled: false
    version: 0.0.1-develop
    chart: mosip/apitestrig
    valuesFile: "$WORKDIR/utils/esignet-signup-apitestrig-values.yaml"
    set:
      crontime: "0 2 * * *"
      apitestrig.configmaps.s3.s3-host: 'http://minio.minio:9000'
      apitestrig.configmaps.s3.s3-user-key: 'admin'
      apitestrig.configmaps.s3.s3-region: ''
      apitestrig.configmaps.db.db-server: "api-internal.${domain_name}"
      apitestrig.configmaps.db.db-su-user: "postgres"
      apitestrig.configmaps.db.db-port: "${esignet_db_port}"
      apitestrig.configmaps.apitestrig.ENV_USER: "api-internal.${env_name}"
      apitestrig.configmaps.apitestrig.ENV_ENDPOINT: "https://api-internal.${domain_name}"
      apitestrig.configmaps.apitestrig.ENV_TESTLEVEL: "smokeAndRegression"
      apitestrig.configmaps.apitestrig.reportExpirationInDays: "3"
      apitestrig.configmaps.apitestrig.slack-webhook-url: "${SLACK_WEBHOOK_URL}"
      apitestrig.configmaps.apitestrig.eSignetDeployed: "yes"
      apitestrig.configmaps.apitestrig.NS: "signup"
      apitestrig.configmaps.apitestrig.servicesNotDeployed: ''
      secrets.s3.s3-user-secret: "${MINIO_ROOT_PASSWORD}"
      apitestrig.variables.push_reports_to_s3: "yes"
    priority: -2
    hooks:
      preInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/apitestrig-signup-setup.sh"

  # ---------------------------------------------------------------------------
  # Signup UI Test Rig — disabled by default
  # Enable only if signup stack (signup-dsf) is deployed.
  # ---------------------------------------------------------------------------
  signup-uitestrig:
    namespace: signup-uitestrig
    enabled: false
    version: 0.0.1-develop
    chart: mosip/uitestrig
    valuesFile: "$WORKDIR/utils/signup-uitestrig-values.yaml"
    set:
      crontime: "0 3 * * *"
      uitestrig.configmaps.s3.s3-host: "http://minio.minio:9000"
      uitestrig.configmaps.s3.s3-user-key: "admin"
      uitestrig.configmaps.s3.s3-region: ""
      uitestrig.configmaps.db.db-server: "api-internal.${domain_name}"
      uitestrig.configmaps.db.db-su-user: "postgres"
      uitestrig.configmaps.db.db-port: "${esignet_db_port}"
      uitestrig.configmaps.uitestrig.ENV_USER: "api-internal.${env_name}"
      uitestrig.configmaps.uitestrig.ENV_ENDPOINT: "https://api-internal.${domain_name}"
      uitestrig.configmaps.uitestrig.reportExpirationInDays: "3"
      uitestrig.configmaps.uitestrig.slack-webhook-url: "${SLACK_WEBHOOK_URL}"
      uitestrig.configmaps.uitestrig.eSignetDeployed: "yes"
      uitestrig.configmaps.uitestrig.NS: "signup-uitestrig"
      uitestrig.variables.push_reports_to_s3: "yes"
    priority: -1
    hooks:
      preInstall: "$WORKDIR/hooks/esignet-standalone-2.0.0/uitestrig-signup-setup.sh"
