helmDefaults:
  tillerNamespace: kube-system
  tillerless: true
  install: true

helmRepos:
  bitnami: https://charts.bitnami.com/bitnami
  mosip: https://mosip.github.io/mosip-helm
  banzaicloud-stable: https://charts.helm.sh/stable
  grafana: https://grafana.github.io/helm-charts
  grafana-community: https://grafana-community.github.io/helm-charts
  prometheus-community: https://prometheus-community.github.io/helm-charts

# Monitoring / logging stack — monitoring_stack input / vars.MONITORING_STACK:
#   standalone (default): kube-prometheus-stack (Prometheus + Alertmanager email)
#                         and Loki + Alloy + Grafana (logging namespace).
#   rancher             : rancher-monitoring (Slack alerting) and ELK
#                         (Elasticsearch + Kibana) with rancher-logging.
# The workflow sets MONITORING_STANDALONE / MONITORING_RANCHER (true/false);
# exactly one stack is enabled. Helmsman uninstalls the releases of the
# disabled stack, so an environment that runs the rancher stack today must set
# monitoring_stack=rancher before its next prereq run. Istio + httpbin are
# installed by the first app of whichever stack is enabled.
#
# Note: Based on your requirement disable the namespaces which you want to use, by default all the namespaces are protected.
namespaces:
  kube-system:
    protected: true
  # standalone stack
  monitoring:
    protected: true
  logging:
    protected: true
  # rancher stack
  cattle-monitoring-system:
    protected: true
  cattle-logging-system:
    protected: true
  istio-system:
    protected: true
  istio-operator:
    protected: true
  httpbin:
    protected: true

apps:
  # ── standalone stack (default) ─────────────────────────────────────────────
  kube-prometheus-stack:
    namespace: monitoring
    enabled: ${MONITORING_STANDALONE}
    version: 88.6.2
    chart: prometheus-community/kube-prometheus-stack
    valuesFile: "$WORKDIR/utils/prometheus-values.yaml"
    wait: true
    timeout: 900
    priority: -6
    hooks:
      # Applies the CRDs of this chart version and creates/updates the SMTP
      # secret (SMTP_PASSWORD is read from the env). Keep the version argument
      # in sync with `version` above.
      preInstall: "$WORKDIR/hooks/monitoring-preinstall.sh 88.6.2"
      preUpgrade: "$WORKDIR/hooks/monitoring-preinstall.sh 88.6.2"
      postInstall: "$WORKDIR/hooks/install-istio-and-httpbin.sh ${domain_name} ${env_name}"
      postUpgrade: "$WORKDIR/hooks/install-istio-and-httpbin.sh ${domain_name} ${env_name}"

  loki:
    namespace: logging
    enabled: ${MONITORING_STANDALONE}
    version: 6.55.0
    chart: grafana/loki
    valuesFile: "$WORKDIR/utils/loki-values.yaml"
    wait: true
    priority: -4
    timeout: 300

  grafana:
    namespace: logging
    enabled: ${MONITORING_STANDALONE}
    version: 12.11.2
    chart: grafana-community/grafana
    valuesFile: "$WORKDIR/utils/grafana-values.yaml"
    wait: true
    priority: -3
    timeout: 300
    hooks:
      # grafana-admin secret (admin.existingSecret) from GRAFANA_ADMIN_PASSWORD
      preInstall: "$WORKDIR/hooks/grafana-preinstall.sh"
      preUpgrade: "$WORKDIR/hooks/grafana-preinstall.sh"
      # (re)apply dashboard ConfigMaps so dashboard changes reach existing envs
      postInstall: "$WORKDIR/hooks/import-dashboards.sh"
      postUpgrade: "$WORKDIR/hooks/import-dashboards.sh"

  alloy:
    namespace: logging
    enabled: ${MONITORING_STANDALONE}
    version: 1.6.2
    chart: grafana/alloy
    valuesFile: "$WORKDIR/utils/alloy-values.yaml"
    wait: true
    priority: -2
    timeout: 300

  istio-addons-loki:
    namespace: logging
    enabled: ${MONITORING_STANDALONE}
    version: 1.0.0
    chart: mosip/istio-addons
    set:
      istio.name: "grafana"
      istio.host: "grafana.${domain_name}"
      istio.ingressController: "ingressgateway-internal"
      istio.port.name: "grafana"
      istio.port.number: "80"
      istio.port.protocol: "HTTP"
      istio.serviceHost: "grafana"
      istio.servicePort: "80"
    wait: true
    priority: -1

  # ── rancher stack (monitoring_stack=rancher) ───────────────────────────────
  rancher-monitoring-crd:
    namespace: cattle-monitoring-system
    enabled: ${MONITORING_RANCHER}
    version: 103.1.1+up45.31.1
    chart: mosip/rancher-monitoring-crd
    wait: true
    timeout: 900
    priority: -6
    hooks:
      postInstall: "$WORKDIR/hooks/install-istio-and-httpbin.sh ${domain_name} ${env_name}"
      postUpgrade: "$WORKDIR/hooks/install-istio-and-httpbin.sh ${domain_name} ${env_name}"

  rancher-monitoring:
    namespace: cattle-monitoring-system
    enabled: ${MONITORING_RANCHER}
    version: 103.1.0+up45.31.1
    chart: mosip/rancher-monitoring
    set:
      grafana.global.cattle.clusterId: "$CLUSTER_ID"
      global.cattle.clusterId: "$CLUSTER_ID"
    wait: true
    valuesFile: "$WORKDIR/utils/monitoring_values.yaml"
    priority: -5
    timeout: 600
    hooks:
      postInstall: "$WORKDIR/hooks/alerting-setup.sh ${slack_channel_name} ${SLACK_WEBHOOK_URL} ${env_name}"

  elasticsearch:
    namespace: cattle-logging-system
    enabled: ${MONITORING_RANCHER}
    version: 17.9.25
    chart: mosip/elasticsearch
    set:
      image.repository: "mosipint/elasticsearch"
      image.tag: "7.17.2-debian-10-r4"
      # Kibana configuration and image
      global.kibanaEnabled: "true"
      kibana.image.repository: "mosipid/kibana"
      kibana.image.tag: "7.17.2-debian-10-r0"
      kibana.image.pullPolicy: IfNotPresent
      data.heapSize: "728m"
      data.persistence.enabled: "true"
      data.persistence.size: "64Gi"
      data.resources.requests.memory: "1100Mi"
      master.heapSize: "1024m"
      master.persistence.enabled: "true"
      master.persistence.size: "4Gi"
      master.resources.requests.memory: "1536Mi"
      kibana.persistence.enabled: "false"
      sysctlImage.repository: "mosipid/os-shell"
      sysctlImage.tag: "12-debian-12-r46"
    wait: true
    timeout: 900
    priority: -4

  istio-addons-logging:
    namespace: cattle-logging-system
    enabled: ${MONITORING_RANCHER}
    version: 0.1.0
    chart: $WORKDIR/utils/istio-addons/logging-istio-addons-0.1.0.tgz
    set:
      kibanaHost: "kibana.${domain_name}"
      installName: "elasticsearch-kibana"
    wait: true
    priority: -3

  rancher-logging-crd:
    namespace: cattle-logging-system
    enabled: ${MONITORING_RANCHER}
    version: 103.1.1+up4.4.0
    chart: mosip/rancher-logging-crd
    wait: true
    priority: -2

  rancher-logging:
    namespace: cattle-logging-system
    enabled: ${MONITORING_RANCHER}
    version: 103.1.1+up4.4.0
    chart: mosip/rancher-logging
    valuesFile: "$WORKDIR/utils/rancher-logging-values.yaml"
    wait: true
    priority: -1
    timeout: 1200
    hooks:
      postInstall: "$WORKDIR/hooks/post_logging-setup.sh"
