apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: grafana
spec:
  hosts:
  - "*"
  gateways:
    - grafana
  http:
  - route:
    - destination:
        host: {{ .Values.installName }}
        port:
          number: {{ .Values.grafanaPort | int }}
    headers:
      request:
        set:
          x-forwarded-proto: https
