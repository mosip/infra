# Combined ID-Repository on the existing identity release.
# Image: nagendra0721/id-repository-service (identity + vid + credential + credentialrequest).
#
# Keep Deployment/Service name `identity`. Recreate the old in-cluster names
# (vid, credential, credentialrequest) as aliases of those pods, and keep the
# old VirtualService names so every previous API and Swagger URL is served
# by this one service (no Swagger redirects).

image:
  registry: docker.io
  repository: nagendra0721/id-repository-service
  tag: 1.4.1-SNAPSHOT-r1
  pullPolicy: Always

springServicePort: 8090

istio:
  enabled: true
  gateway: istio-system/internal
  prefix: /idrepository/v1/identity

extraDeploy:
  - apiVersion: v1
    kind: Service
    metadata:
      name: vid
      namespace: '{{ .Release.Namespace }}'
      labels:
        mosip.io/alias-of: identity
    spec:
      selector:
        app.kubernetes.io/instance: '{{ .Release.Name }}'
        app.kubernetes.io/name: identity
      ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: 8090
  - apiVersion: v1
    kind: Service
    metadata:
      name: credential
      namespace: '{{ .Release.Namespace }}'
      labels:
        mosip.io/alias-of: identity
    spec:
      selector:
        app.kubernetes.io/instance: '{{ .Release.Name }}'
        app.kubernetes.io/name: identity
      ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: 8090
  - apiVersion: v1
    kind: Service
    metadata:
      name: credentialrequest
      namespace: '{{ .Release.Namespace }}'
      labels:
        mosip.io/alias-of: identity
    spec:
      selector:
        app.kubernetes.io/instance: '{{ .Release.Name }}'
        app.kubernetes.io/name: identity
      ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: 8090
  - apiVersion: networking.istio.io/v1alpha3
    kind: VirtualService
    metadata:
      name: vid
      namespace: '{{ .Release.Namespace }}'
    spec:
      hosts:
        - "*"
      gateways:
        - istio-system/internal
      http:
        - match:
            - uri:
                prefix: /idrepository/v1
          route:
            - destination:
                host: identity
                port:
                  number: 80
          headers:
            request:
              set:
                x-forwarded-proto: https
  - apiVersion: networking.istio.io/v1alpha3
    kind: VirtualService
    metadata:
      name: credential
      namespace: '{{ .Release.Namespace }}'
    spec:
      hosts:
        - "*"
      gateways:
        - istio-system/internal
      http:
        - match:
            - uri:
                prefix: /v1/credentialservice
          route:
            - destination:
                host: identity
                port:
                  number: 80
          headers:
            request:
              set:
                x-forwarded-proto: https
  - apiVersion: networking.istio.io/v1alpha3
    kind: VirtualService
    metadata:
      name: credentialrequest
      namespace: '{{ .Release.Namespace }}'
    spec:
      hosts:
        - "*"
      gateways:
        - istio-system/internal
      http:
        - match:
            - uri:
                prefix: /v1/credentialrequest
          route:
            - destination:
                host: identity
                port:
                  number: 80
          headers:
            request:
              set:
                x-forwarded-proto: https
