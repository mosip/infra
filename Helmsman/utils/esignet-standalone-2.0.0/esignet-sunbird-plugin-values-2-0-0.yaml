# eSignet Sunbird — plugin 3 (sunbird-rc-plugin) runtime configuration.
# pluginNameEnv=sunbird-rc-plugin.jar set in DSF set: block.
# Update MOSIP_ESIGNET_SUNBIRD_RC_REGISTRY_GET_URL to your Sunbird registry host.

# Override full extraEnvVars to use namespace-specific softhsm secret name.
extraEnvVars:
  KEYCLOAK_EXTERNAL_URL:
    valueFrom:
      configMapKeyRef:
        name: keycloak-host
        key: keycloak-external-url
  MOSIP_ESIGNET_CAPTCHA_MODULE_NAME: esignetgosunbird
  REDIS_HOST:
    valueFrom:
      configMapKeyRef:
        name: redis-config
        key: redis-host
  REDIS_PORT:
    valueFrom:
      configMapKeyRef:
        name: redis-config
        key: redis-port
  REDIS_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: redis
        key: redis-password
  DATABASE_HOST:
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-host
  DATABASE_PORT:
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-port
  DATABASE_NAME:
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-name
  DATABASE_USERNAME:
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-username
  DB_DBUSER_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: db-common-secrets
        key: db-dbuser-password
  SOFTHSM_ESIGNET_SECURITY_PIN:
    valueFrom:
      secretKeyRef:
        name: esignet-softhsm-go-sunbird
        key: security-pin
  MOSIP_IDA_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: keycloak-client-secrets
        key: mosip_ida_client_secret
  AUTHN_PROVIDER: mosip
  KEYMANAGER_DB_SCHEMA: esignet
  KEYMANAGER_KEYSTORE_TYPE: PKCS11
  KEYMANAGER_PKCS11_MODULE_PATH: /usr/lib/softhsm/libsofthsm2.so
  KEYMANAGER_PKCS11_TOKEN_LABEL: esignet
  KEYMANAGER_PKCS11_SLOT_ID: "0"
  KEYMANAGER_PKCS11_PIN:
    valueFrom:
      secretKeyRef:
        name: esignet-softhsm-go-sunbird
        key: security-pin
  OIDC_UI_SCHEME: https
  OIDC_UI_PORT: '443'
  OIDC_UI_LOGIN_PATH: /signin
  OIDC_UI_ERROR_PATH: /error
  DEFAULT_THEME_ID: decl-theme-1
  DEFAULT_LAYOUT_ID: decl-layout-1
  DEFAULT_AUTH_FLOW_ID: decl-mosip-otp-flow-1

extraEnvVarsAdditional:
  "MOSIP_ESIGNET_CAPTCHA_SITE_KEY":
    valueFrom:
      secretKeyRef:
        name: esignet-captcha-go-sunbird
        key: esignet-captcha-site-key
  "MOSIP_ESIGNET_CAPTCHA_REQUIRED": ""

  # ---------------------------------------------------------------------------
  # Plugin 3: sunbird-rc-plugin
  # Update URLs to match your Sunbird RC registry deployment.
  # ---------------------------------------------------------------------------
  "MOSIP_ESIGNET_INTEGRATION_AUDIT_PLUGIN": "LoggerAuditService"
  "MOSIP_ESIGNET_INTEGRATION_KEY_BINDER": "NoOpKeyBinder"
  MOSIP_ESIGNET_AUTHENTICATE_ATTEMPTS: '300'
  MOSIP_ESIGNET_AUTHENTICATOR_DEFAULT_AUTH_FACTOR_KBI_INDIVIDUAL_ID_FIELD: "policyNumber"
