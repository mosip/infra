# eSignet standalone — plugin and captcha runtime configuration.
#
# Plugin selection:
#   Plugin 1 (mock):            pluginNameEnv=esignet-mock-plugin.jar  → no changes needed here
#   Plugin 2 (mosip-identity):  pluginNameEnv=mosip-identity-plugin.jar → uncomment IDA section below
#   Plugin 3 (sunbird-rc):      pluginNameEnv=sunbird-rc-plugin.jar    → uncomment Sunbird section below
#   Plugin 4 (custom):          pluginNameEnv=<your-jar> pluginUrlEnv=<url> → no changes needed here
#

## Uncomment required parms added with single '#' when needed.


extraEnvVars:
 KEYCLOAK_EXTERNAL_URL:
   valueFrom:
     configMapKeyRef:
       name: keycloak-host
       key: keycloak-external-url
 MOSIP_ESIGNET_CAPTCHA_SITE_KEY:
   valueFrom:
     secretKeyRef:
       name: esignet-captcha-go
       key: esignet-captcha-site-key
 MOSIP_ESIGNET_CAPTCHA_MODULE_NAME: esignetgo
 REDIS_HOST:
   valueFrom:
     configMapKeyRef:
       name: redis-config
       key: redis-host
 REDIS_PORT:
   valueFrom:
     configMapKeyRef:
       name: redis-config
       key: redis-port
 REDIS_PASSWORD:
   valueFrom:
     secretKeyRef:
       name: redis
       key: redis-password
 DATABASE_HOST:
   valueFrom:
     configMapKeyRef:
       name: postgres-config
       key: database-host
 DATABASE_PORT:
   valueFrom:
     configMapKeyRef:
       name: postgres-config
       key: database-port
 DATABASE_NAME:
   valueFrom:
     configMapKeyRef:
       name: postgres-config
       key: database-name
 DATABASE_USERNAME:
   valueFrom:
     configMapKeyRef:
       name: postgres-config
       key: database-username
 DB_DBUSER_PASSWORD:
   valueFrom:
     secretKeyRef:
       name: db-common-secrets
       key: db-dbuser-password
 SOFTHSM_ESIGNET_SECURITY_PIN:
   valueFrom:
     secretKeyRef:
       name: esignet-softhsm-go
       key: security-pin
 MOSIP_IDA_CLIENT_SECRET:
   valueFrom:
     secretKeyRef:
       name: keycloak-client-secrets
       key: mosip_ida_client_secret
 AUTHN_PROVIDER: mosip
 KEYMANAGER_DB_SCHEMA: esignet
 KEYMANAGER_KEYSTORE_TYPE: PKCS11
 KEYMANAGER_PKCS11_MODULE_PATH: /usr/lib/softhsm/libsofthsm2.so
 KEYMANAGER_PKCS11_TOKEN_LABEL: esignet
 KEYMANAGER_PKCS11_SLOT_ID: "0"
 KEYMANAGER_PKCS11_PIN:
   valueFrom:
     secretKeyRef:
       name: esignet-softhsm-go
       key: security-pin
 OIDC_UI_SCHEME: https
 OIDC_UI_PORT: '443'
 OIDC_UI_LOGIN_PATH: /signin
 OIDC_UI_ERROR_PATH: /error
 DEFAULT_THEME_ID: decl-theme-1
 DEFAULT_LAYOUT_ID: decl-layout-1
 DEFAULT_AUTH_FLOW_ID: decl-mosip-otp-flow-1
# extraEnvVarsCM:
#  - esignet-softhsm-share

#extraEnvVarsSecret: []

#istio:
#  enabled: true
#  gateways:
#    - istio-system/public
#    - istio-system/internal
#  prefix: /v1/esignet/


# extraEnvVarsAdditional is a map — entries here deep-merge with the chart's own
# defaults key-by-key, so only the entries that differ need to be listed here.

extraEnvVarsAdditional:
  # Captcha site key — from esignet-captcha secret (deployed by external-dsf)
  "MOSIP_ESIGNET_CAPTCHA_SITE_KEY":
    valueFrom:
      secretKeyRef:
        name: esignet-captcha-go
        key: esignet-captcha-site-key
  "MOSIP_ESIGNET_CAPTCHA_REQUIRED": ""

