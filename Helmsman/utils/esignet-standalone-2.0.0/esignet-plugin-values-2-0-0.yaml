# eSignet standalone — plugin and captcha runtime configuration.
#
# Plugin selection:
#   Plugin 1 (mock):            pluginNameEnv=esignet-mock-plugin.jar  → no changes needed here
#   Plugin 2 (mosip-identity):  pluginNameEnv=mosip-identity-plugin.jar → uncomment IDA section below
#   Plugin 3 (sunbird-rc):      pluginNameEnv=sunbird-rc-plugin.jar    → uncomment Sunbird section below
#   Plugin 4 (custom):          pluginNameEnv=<your-jar> pluginUrlEnv=<url> → no changes needed here
#

## Uncomment required parms added with single '#' when needed.


extraEnvVars:
 - name: KEYCLOAK_EXTERNAL_URL
   valueFrom:
     configMapKeyRef:
       name: keycloak-host
       key: keycloak-external-url
 - name: MOSIP_ESIGNET_CAPTCHA_SITE_KEY
   valueFrom:
     secretKeyRef:
       name: esignet-captcha-go
       key: esignet-captcha-site-key
 - name: MOSIP_ESIGNET_CAPTCHA_MODULE_NAME
   value: esignet
 - name: REDIS_HOST
   valueFrom:
     configMapKeyRef:
       name: redis-config
       key: redis-host
 - name: REDIS_PORT
   valueFrom:
     configMapKeyRef:
       name: redis-config
       key: redis-port
 - name: REDIS_PASSWORD
   valueFrom:
     secretKeyRef:
       name: redis
       key: redis-password
 - name: DATABASE_HOST
   valueFrom:
     configMapKeyRef:
       name: postgres-config
       key: database-host
 - name: DATABASE_PORT
   valueFrom:
     configMapKeyRef:
       name: postgres-config
       key: database-port
 - name: DATABASE_NAME
   valueFrom:
     configMapKeyRef:
       name: postgres-config
       key: database-name
 - name: DATABASE_USERNAME
   valueFrom:
     configMapKeyRef:
       name: postgres-config
       key: database-username
 - name: DB_DBUSER_PASSWORD
   valueFrom:
     secretKeyRef:
       name: db-common-secrets
       key: db-dbuser-password
 - name: SOFTHSM_ESIGNET_SECURITY_PIN
   valueFrom:
     secretKeyRef:
       name: esignet-softhsm-go
       key: security-pin
 - name: MOSIP_IDA_CLIENT_SECRET
   valueFrom:
     secretKeyRef:
       name: keycloak-client-secrets
       key: mosip_ida_client_secret
 - name: AUTHN_PROVIDER
   value: mosip
 - name: MOSIP_P12_PATH
   value: /home/mosip/keys/secret/esignet.pfx
 - name: MOSIP_P12_PASSWORD
   value: localtest
 - name: OIDC_UI_SCHEME
   value: https
 - name: CRYPTO_ENCRYPTION_KEY
   value: 0579f866ac7c9273580d0ff163fa01a7b2401a7ff3ddc3e3b14ae3136fa6025e
 - name: OIDC_UI_PORT
   value: '443'
 - name: OIDC_UI_LOGIN_PATH
   value: /signin
 - name: OIDC_UI_ERROR_PATH
   value: /error
 - name: DEFAULT_THEME_ID
   value: decl-theme-1
 - name: DEFAULT_LAYOUT_ID
   value: decl-layout-1
 - name: DEFAULT_AUTH_FLOW_ID
   value: decl-mosip-otp-flow-1
