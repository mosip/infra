# eSignet MOSIPID1 — plugin 2 (mosip-identity-plugin) runtime configuration.
# pluginNameEnv=mosip-identity-plugin.jar set in DSF set: block.
# Update IDA service URLs below to match your MOSIP IDA deployment.

# Override full extraEnvVars to use namespace-specific softhsm secret name.
extraEnvVars:
  KEYCLOAK_EXTERNAL_URL:
    valueFrom:
      configMapKeyRef:
        name: keycloak-host
        key: keycloak-external-url
  REDIS_HOST:
    valueFrom:
      configMapKeyRef:
        name: redis-config
        key: redis-host
  REDIS_PORT:
    valueFrom:
      configMapKeyRef:
        name: redis-config
        key: redis-port
  REDIS_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: redis
        key: redis-password
  DATABASE_HOST:
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-host
  DATABASE_PORT:
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-port
  DATABASE_NAME:
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-name
  DATABASE_USERNAME:
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-username
  DB_DBUSER_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: db-common-secrets
        key: db-dbuser-password
  SOFTHSM_ESIGNET_SECURITY_PIN:
    valueFrom:
      secretKeyRef:
        name: esignet-softhsm-go-mosipid1
        key: security-pin
  MOSIP_IDA_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: keycloak-client-secrets-mosipid1
        key: mosip_ida_client_secret
  AUTHN_PROVIDER: mosip
  KEYMANAGER_DB_SCHEMA: esignet
  KEYMANAGER_KEYSTORE_TYPE: PKCS12
  KEYMANAGER_PKCS12_FILE_PATH: /home/mosip/keys/secret/mosipid1.pfx
  OIDC_UI_SCHEME: https
  OIDC_UI_PORT: '443'
  OIDC_UI_LOGIN_PATH: /signin
  OIDC_UI_ERROR_PATH: /error
  DEFAULT_THEME_ID: decl-theme-1
  DEFAULT_LAYOUT_ID: decl-layout-1
  DEFAULT_AUTH_FLOW_ID: decl-mosip-otp-flow-1
extraEnvVarsSecret:
  - esignet-keystore-go-mosipid1
extraVolumes:
  - name: esignet-keystore-go-mosipid1
    secret:
      secretName: esignet-keystore-go-mosipid1
extraVolumeMounts:
  - name: esignet-keystore-go-mosipid1
    mountPath: /home/mosip/keys/secret
extraEnvVarsAdditional:
  "MOSIP_ESIGNET_CAPTCHA_MODULE_NAME": "esignetgomosipid1"
  "MOSIP_ESIGNET_CAPTCHA_SITE-KEY":
    valueFrom:
      secretKeyRef:
        name: esignet-captcha-go-mosipid1
        key: esignet-captcha-site-key

  # ---------------------------------------------------------------------------
  # Plugin 2: mosip-identity-plugin
  # Update URLs to match your MOSIP IDA deployment.
  # ---------------------------------------------------------------------------
  NAMESPACE: mosipid1
  plugin_name_env: mosip-identity-plugin.jar
  SPRING_KAFKA_CONSUMER_GROUP_ID: esignet-consumer-esignet-mosipid1
  MOSIP_ESIGNET_SIGNUP_ID_TOKEN_AUDIENCE: esignet-mosipid1-signup-esqa020
  MOSIP_ESIGNET_AUTHENTICATOR_IDA_OTP_CHANNELS: email,phone
  MOSIP_ESIGNET_SEND_OTP_ATTEMPTS: '300'
  MOSIP_ESIGNET_AUTHENTICATE_ATTEMPTS: '300'
  MOSIP_ESIGNET_AUTHENTICATION_EXPIRE_IN_SECS: '600'
  MOSIP_ESIGNET_PREAUTHENTICATION_EXPIRE_IN_SECS: '600'
  MOSIP_ESIGNET_UI_CONFIG_USERNAME_POSTFIX: '@phone'
  MOSIP_ESIGNET_UI_CONFIG_LOGIN_ID_OPTIONS:
    value: >-
      {{ "{{" }} 'id': 'mobile', 'svg': 'mobile_icon', 'prefixes': {{ "{{" }}'label':
      'IND', 'value': '+91', 'maxLength': '', 'regex': ''},{'label':
      'KHM', 'value': '+855', 'regex': ''{{ "}}" }}, 'postfix': '@phone',
      'maxLength': '', 'regex': '' }, { 'id': 'nrc', 'svg':
      'nrc_id_icon', 'prefixes': '', 'postfix': '@nrc', 'maxLength':
      '', 'regex': '' }, { 'id': 'vid', 'svg': 'vid_icon', 'prefixes':
      '', 'postfix': '', 'maxLength': '', 'regex': '' }, { 'id':
      'email', 'svg': 'email_icon', 'prefixes': '', 'postfix':
      '@email', 'maxLength': '', 'regex': '' {{ "}}" }}
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_CLIENT: INFO
  MOSIP_ESIGNET_CAPTCHA_REQUIRED: "false"
  MOSIP_ESIGNET_CAPTCHA_URL: http://captcha.captcha
  "MOSIP_ESIGNET_MISP_KEY":
    valueFrom:
      secretKeyRef:
        name: esignet-misp-onboarder-key
        key: mosip-esignet-misp-key
