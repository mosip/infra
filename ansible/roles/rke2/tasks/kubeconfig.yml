---
# Ported verbatim (logic unchanged) from the "Setup kubectl configuration"
# blocks in rke2-playbook.yml — identical on the primary and on any
# subsequent control-plane node, so it's one shared file per the tree
# structure, included from both primary.yml and subsequent.yml.

- name: Wait for RKE2 kubeconfig to be available
  ansible.builtin.wait_for:
    path: "{{ rke2_config_dir }}/rke2.yaml"
    timeout: 300

- name: Create kubectl symlink
  ansible.builtin.file:
    src: /var/lib/rancher/rke2/bin/kubectl
    dest: /usr/local/bin/kubectl
    state: link
    force: true

- name: Create .kube directory
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Generate kubeconfig
  ansible.builtin.shell: |
    cat {{ rke2_config_dir }}/rke2.yaml | \
    sed "s/127.0.0.1/{{ ansible_default_ipv4.address }}/g" | \
    sed "s/default/{{ cluster_name }}/g" > \
    "/home/ubuntu/.kube/{{ inventory_hostname }}.yaml"
  args:
    executable: /bin/bash
    creates: "/home/ubuntu/.kube/{{ inventory_hostname }}.yaml"
  no_log: true

- name: Set kubeconfig ownership and permissions
  ansible.builtin.file:
    path: "/home/ubuntu/.kube/{{ inventory_hostname }}.yaml"
    owner: ubuntu
    group: ubuntu
    mode: '0444'
