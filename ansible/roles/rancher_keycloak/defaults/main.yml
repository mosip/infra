---
# Rancher UI + Keycloak for the observability (management) cluster — only
# run by profiles whose profile.yml lists `rancher_keycloak`.
#
# Required from the inventory / extra vars (no safe default):
#   rancher_password — Rancher bootstrap password. Keep it in a secret
#                      (GitHub secret / vault), never in a committed file.

rancher_ui_version: "2.8.3"
rancher_hostname: "rancher.{{ cluster_env_domain }}"
keycloak_hostname: "iam.{{ cluster_env_domain }}"

rancher_helm_version: "{{ rancher_ui_version }}"
rancher_bootstrap_password: "{{ rancher_password }}"

kubeconfig_path: "/etc/rancher/rke2/rke2.yaml"
kubectl_path: "/var/lib/rancher/rke2/bin/kubectl"
k8s_infra_path: "/home/ubuntu/k8s-infra"
k8s_infra_repo: "{{ k8s_infra_repo_url }}"

# Set to true to print the bootstrap password in the job log.
debug_rancher: false
