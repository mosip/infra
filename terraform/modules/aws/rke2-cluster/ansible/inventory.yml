---
all:
  vars:
    cluster_name: "performance"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/ksn48vnzqcjx27wbshx8whgvz59cjs5kn6vt66wpqpcvnddr72s9r9_c-c8ms8.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        performance-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.74.220
          node_role: control_plane
          is_primary: true
          node_index: 0
    
    etcd:
      hosts:
        performance-ETCD-NODE-1:
          ansible_host: 172.31.75.192
          node_role: etcd
        performance-ETCD-NODE-2:
          ansible_host: 172.31.73.119
          node_role: etcd
        performance-ETCD-NODE-3:
          ansible_host: 172.31.70.185
          node_role: etcd
    
    workers:
      hosts:
        performance-WORKER-NODE-1:
          ansible_host: 172.31.66.131
          node_role: worker
        performance-WORKER-NODE-2:
          ansible_host: 172.31.73.202
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
