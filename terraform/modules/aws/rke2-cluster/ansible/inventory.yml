---
all:
  vars:
    cluster_name: "loki"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/jpc2r6mm6s94tsh5j29jslvg6gtlsqvdtdtdf62ggqzpj5jvzrtt97_c-m-tp2qj7hc.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        loki-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.67.105
          node_role: control_plane
          is_primary: true
          node_index: 0
        loki-CONTROL-PLANE-NODE-2:
          ansible_host: 172.31.65.93
          node_role: control_plane
          is_primary: false
          node_index: 1
        loki-CONTROL-PLANE-NODE-3:
          ansible_host: 172.31.77.138
          node_role: control_plane
          is_primary: false
          node_index: 2
    
    etcd:
      hosts:
        loki-ETCD-NODE-1:
          ansible_host: 172.31.69.116
          node_role: etcd
        loki-ETCD-NODE-2:
          ansible_host: 172.31.77.30
          node_role: etcd
        loki-ETCD-NODE-3:
          ansible_host: 172.31.78.189
          node_role: etcd
    
    workers:
      hosts:
        loki-WORKER-NODE-1:
          ansible_host: 172.31.73.167
          node_role: worker
        loki-WORKER-NODE-2:
          ansible_host: 172.31.64.90
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
