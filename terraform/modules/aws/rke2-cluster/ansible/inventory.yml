---
all:
  vars:
    cluster_name: "qaj21perf"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/pxwxxl456zkbjq6qhzhg8qkf6486lmns8ph42pr2dpzzzkwbpkbj4p_c-m-nmhzvr4t.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        qaj21perf-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.64.240
          node_role: control_plane
          is_primary: true
          node_index: 0
        qaj21perf-CONTROL-PLANE-NODE-2:
          ansible_host: 172.31.70.76
          node_role: control_plane
          is_primary: false
          node_index: 1
        qaj21perf-CONTROL-PLANE-NODE-3:
          ansible_host: 172.31.79.126
          node_role: control_plane
          is_primary: false
          node_index: 2
    
    etcd:
      hosts:
        qaj21perf-ETCD-NODE-1:
          ansible_host: 172.31.79.249
          node_role: etcd
        qaj21perf-ETCD-NODE-2:
          ansible_host: 172.31.79.180
          node_role: etcd
        qaj21perf-ETCD-NODE-3:
          ansible_host: 172.31.70.48
          node_role: etcd
    
    workers:
      hosts:
        qaj21perf-WORKER-NODE-1:
          ansible_host: 172.31.79.169
          node_role: worker
        qaj21perf-WORKER-NODE-2:
          ansible_host: 172.31.66.138
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
