---
all:
  vars:
    cluster_name: "test2"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/rvg46n8zcgjsgp5h5wcr8nkh9w2fnfzvkmzzsf6vzk29kj2zmdr48t_c-mccxl.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        test2-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.75.74
          node_role: control_plane
          is_primary: true
          node_index: 0
    
    etcd:
      hosts:
        test2-ETCD-NODE-1:
          ansible_host: 172.31.78.52
          node_role: etcd
    
    workers:
      hosts:
        test2-WORKER-NODE-1:
          ansible_host: 172.31.65.117
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
