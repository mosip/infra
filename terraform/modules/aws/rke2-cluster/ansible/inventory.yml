---
all:
  vars:
    cluster_name: "QADRAFT"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/lbscvhd9dqbrvr9wj6xd599c4stskz2qddv7vlvvl2nzlpkgcvwd94_c-m-7xxfmr45.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        QADRAFT-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.64.151
          node_role: control_plane
          is_primary: true
          node_index: 0
        QADRAFT-CONTROL-PLANE-NODE-2:
          ansible_host: 172.31.67.151
          node_role: control_plane
          is_primary: false
          node_index: 1
        QADRAFT-CONTROL-PLANE-NODE-3:
          ansible_host: 172.31.64.216
          node_role: control_plane
          is_primary: false
          node_index: 2
    
    etcd:
      hosts:
        QADRAFT-ETCD-NODE-1:
          ansible_host: 172.31.65.39
          node_role: etcd
        QADRAFT-ETCD-NODE-2:
          ansible_host: 172.31.72.149
          node_role: etcd
        QADRAFT-ETCD-NODE-3:
          ansible_host: 172.31.76.242
          node_role: etcd
    
    workers:
      hosts:
        QADRAFT-WORKER-NODE-1:
          ansible_host: 172.31.72.224
          node_role: worker
        QADRAFT-WORKER-NODE-2:
          ansible_host: 172.31.68.65
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
