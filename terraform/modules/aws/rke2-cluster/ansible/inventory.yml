---
all:
  vars:
    cluster_name: "qaj21"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/x29cms47k9s9nmss9n6jfp8nzkf29twcdnhm2sw2h5fb4qt24fvfhr_c-m-txcf6n8z.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        qaj21-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.71.151
          node_role: control_plane
          is_primary: true
          node_index: 0
        qaj21-CONTROL-PLANE-NODE-2:
          ansible_host: 172.31.70.21
          node_role: control_plane
          is_primary: false
          node_index: 1
        qaj21-CONTROL-PLANE-NODE-3:
          ansible_host: 172.31.73.111
          node_role: control_plane
          is_primary: false
          node_index: 2
    
    etcd:
      hosts:
        qaj21-ETCD-NODE-1:
          ansible_host: 172.31.73.88
          node_role: etcd
        qaj21-ETCD-NODE-2:
          ansible_host: 172.31.77.253
          node_role: etcd
        qaj21-ETCD-NODE-3:
          ansible_host: 172.31.72.252
          node_role: etcd
    
    workers:
      hosts:
        qaj21-WORKER-NODE-1:
          ansible_host: 172.31.74.29
          node_role: worker
        qaj21-WORKER-NODE-2:
          ansible_host: 172.31.71.41
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
