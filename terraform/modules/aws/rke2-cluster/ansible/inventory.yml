---
all:
  vars:
    cluster_name: "131ga"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/j4pqp8pgrspp5rqghpvs2cmnw9vkm48jt2cskbtfmcxjrvgdgszdxb_c-m-hzk6258h.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        131ga-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.72.235
          node_role: control_plane
          is_primary: true
          node_index: 0
        131ga-CONTROL-PLANE-NODE-2:
          ansible_host: 172.31.78.68
          node_role: control_plane
          is_primary: false
          node_index: 1
        131ga-CONTROL-PLANE-NODE-3:
          ansible_host: 172.31.75.71
          node_role: control_plane
          is_primary: false
          node_index: 2
    
    etcd:
      hosts:
        131ga-ETCD-NODE-1:
          ansible_host: 172.31.74.24
          node_role: etcd
        131ga-ETCD-NODE-2:
          ansible_host: 172.31.65.141
          node_role: etcd
        131ga-ETCD-NODE-3:
          ansible_host: 172.31.77.194
          node_role: etcd
    
    workers:
      hosts:
        131ga-WORKER-NODE-1:
          ansible_host: 172.31.73.92
          node_role: worker
        131ga-WORKER-NODE-2:
          ansible_host: 172.31.68.127
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
