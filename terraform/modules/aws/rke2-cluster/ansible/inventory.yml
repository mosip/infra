---
all:
  vars:
    cluster_name: "qadraft"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/lqsrz5b2hws4xqggx98xmkt2rxs8jfb8dsdvjcdr7tcpmqxj4t9hc9_c-m-djp2r8gk.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        qadraft-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.71.68
          node_role: control_plane
          is_primary: true
          node_index: 0
        qadraft-CONTROL-PLANE-NODE-2:
          ansible_host: 172.31.71.198
          node_role: control_plane
          is_primary: false
          node_index: 1
        qadraft-CONTROL-PLANE-NODE-3:
          ansible_host: 172.31.79.138
          node_role: control_plane
          is_primary: false
          node_index: 2
    
    etcd:
      hosts:
        qadraft-ETCD-NODE-1:
          ansible_host: 172.31.64.95
          node_role: etcd
        qadraft-ETCD-NODE-2:
          ansible_host: 172.31.72.58
          node_role: etcd
        qadraft-ETCD-NODE-3:
          ansible_host: 172.31.75.102
          node_role: etcd
    
    workers:
      hosts:
        qadraft-WORKER-NODE-1:
          ansible_host: 172.31.75.60
          node_role: worker
        qadraft-WORKER-NODE-2:
          ansible_host: 172.31.65.244
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
