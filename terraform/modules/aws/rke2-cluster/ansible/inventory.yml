---
all:
  vars:
    cluster_name: "microqa"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/zff5xnb9rhxhm8z4h2z478p4k4c5nwcxf7xm988gbc5bndw6qbp66h_c-4rvjz.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        microqa-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.73.212
          node_role: control_plane
          is_primary: true
          node_index: 0
        microqa-CONTROL-PLANE-NODE-2:
          ansible_host: 172.31.67.24
          node_role: control_plane
          is_primary: false
          node_index: 1
        microqa-CONTROL-PLANE-NODE-3:
          ansible_host: 172.31.73.53
          node_role: control_plane
          is_primary: false
          node_index: 2
    
    etcd:
      hosts:
        microqa-ETCD-NODE-1:
          ansible_host: 172.31.71.55
          node_role: etcd
        microqa-ETCD-NODE-2:
          ansible_host: 172.31.68.169
          node_role: etcd
        microqa-ETCD-NODE-3:
          ansible_host: 172.31.72.76
          node_role: etcd
    
    workers:
      hosts:
        microqa-WORKER-NODE-1:
          ansible_host: 172.31.76.58
          node_role: worker
        microqa-WORKER-NODE-2:
          ansible_host: 172.31.69.4
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
