---
all:
  vars:
    cluster_name: "dev1"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/cmclqkxjl8tr4q2hf6gq7ghs6p68cf9dmr5f97vmccjdbs5nrr9b8f.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        dev1-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.64.137
          node_role: control_plane
          is_primary: true
          node_index: 0
        dev1-CONTROL-PLANE-NODE-2:
          ansible_host: 172.31.76.127
          node_role: control_plane
          is_primary: false
          node_index: 1
        dev1-CONTROL-PLANE-NODE-3:
          ansible_host: 172.31.79.96
          node_role: control_plane
          is_primary: false
          node_index: 2
    
    etcd:
      hosts:
        dev1-ETCD-NODE-1:
          ansible_host: 172.31.72.247
          node_role: etcd
        dev1-ETCD-NODE-2:
          ansible_host: 172.31.77.125
          node_role: etcd
        dev1-ETCD-NODE-3:
          ansible_host: 172.31.79.171
          node_role: etcd
    
    workers:
      hosts:
        dev1-WORKER-NODE-1:
          ansible_host: 172.31.75.44
          node_role: worker
        dev1-WORKER-NODE-2:
          ansible_host: 172.31.69.113
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
