---
all:
  vars:
    cluster_name: "dev1"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/25vr9dfp4vv6v9qj42gxrhj2l7t5s4p7fzwzwnlxxj9hk7rkk9v5mw_c-m-czttcqpx.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        dev1-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.76.3
          node_role: control_plane
          is_primary: true
          node_index: 0
        dev1-CONTROL-PLANE-NODE-2:
          ansible_host: 172.31.65.114
          node_role: control_plane
          is_primary: false
          node_index: 1
        dev1-CONTROL-PLANE-NODE-3:
          ansible_host: 172.31.72.121
          node_role: control_plane
          is_primary: false
          node_index: 2
    
    etcd:
      hosts:
        dev1-ETCD-NODE-1:
          ansible_host: 172.31.64.140
          node_role: etcd
        dev1-ETCD-NODE-2:
          ansible_host: 172.31.72.93
          node_role: etcd
        dev1-ETCD-NODE-3:
          ansible_host: 172.31.76.149
          node_role: etcd
    
    workers:
      hosts:
        dev1-WORKER-NODE-1:
          ansible_host: 172.31.75.217
          node_role: worker
        dev1-WORKER-NODE-2:
          ansible_host: 172.31.69.88
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
