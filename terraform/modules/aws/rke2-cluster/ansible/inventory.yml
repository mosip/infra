---
all:
  vars:
    cluster_name: "pmsqa"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/mj5dtdc86jlpbhrs9s9v7hm2x8bw9htqpsgmjbdgnw2wvm876xmcz2_c-m-wfrcsl4f.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        pmsqa-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.75.63
          node_role: control_plane
          is_primary: true
          node_index: 0
        pmsqa-CONTROL-PLANE-NODE-2:
          ansible_host: 172.31.78.120
          node_role: control_plane
          is_primary: false
          node_index: 1
        pmsqa-CONTROL-PLANE-NODE-3:
          ansible_host: 172.31.75.53
          node_role: control_plane
          is_primary: false
          node_index: 2
    
    etcd:
      hosts:
        pmsqa-ETCD-NODE-1:
          ansible_host: 172.31.69.159
          node_role: etcd
        pmsqa-ETCD-NODE-2:
          ansible_host: 172.31.69.54
          node_role: etcd
        pmsqa-ETCD-NODE-3:
          ansible_host: 172.31.78.56
          node_role: etcd
    
    workers:
      hosts:
        pmsqa-WORKER-NODE-1:
          ansible_host: 172.31.65.152
          node_role: worker
        pmsqa-WORKER-NODE-2:
          ansible_host: 172.31.75.85
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
