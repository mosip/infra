---
all:
  vars:
    cluster_name: "esgotest"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "release-1.2.1.x"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip.net/v3/import/f25prw8zrsc959n2bk25mn79twtwmpq6hpxphf9xt97dhbm797r99n_c-stb2m.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        esgotest-CONTROL-PLANE-NODE-1:
          ansible_host: 172.31.66.49
          node_role: control_plane
          is_primary: true
          node_index: 0
    
    etcd:
      hosts:
        esgotest-ETCD-NODE-1:
          ansible_host: 172.31.69.175
          node_role: etcd
    
    workers:
      hosts:
        esgotest-WORKER-NODE-1:
          ansible_host: 172.31.77.192
          node_role: worker
        esgotest-WORKER-NODE-2:
          ansible_host: 172.31.74.226
          node_role: worker
        esgotest-WORKER-NODE-3:
          ansible_host: 172.31.79.164
          node_role: worker
        esgotest-WORKER-NODE-4:
          ansible_host: 172.31.76.206
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
